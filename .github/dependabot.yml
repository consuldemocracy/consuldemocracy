version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 50
  labels:
    - "dependencies"
  groups:
    capybara:
      patterns:
        - "capybara"
        - "selenium-webdriver"
    caxlsx:
      patterns:
        - "caxlsx"
        - "caxlsx_rails"
    image_processing:
      patterns:
        - "image_processing"
        - "mini_magick"
    pdf_metadata:
      patterns:
        - "exiftool_vendored"
        - "pdf-reader"
    puma:
      patterns:
        - "capistrano3-puma"
        - "puma"
    rubocop:
      patterns:
        - "rubocop"
        - "rubocop-*"
    sass:
      patterns:
        - "sassc-embedded"
        - "sassc-rails"
    simplecov:
      patterns:
        - "simplecov"
        - "simplecov-lcov"
    sprockets:
      patterns:
        - "sprockets"
        - "sprockets-rails"
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 50
  groups:
    leaflet:
      patterns:
        - "leaflet"
        - "leaflet.*"
    eslint:
      patterns:
        - "@eslint*"
        - "eslint"
        - "globals"
    stylelint:
      patterns:
        - "postcss-scss"
        - "stylelint"
        - "stylelint-*"
        - "@stylistic*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 50
  groups:
    actions:
      patterns:
        - "*"
