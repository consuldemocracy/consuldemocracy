      feature_disabled: "Αυτή η λειτουργία είναι απενεργοποιημένη. Για να χρησιμοποιήσετε τη Μηχανική Μάθηση μπορείτε να την ενεργοποιήσετε από τη %{link}."
      feature_disabled_link: "σελίδα ρυθμίσεων"
      help:
        title_1: "Τι είναι η Τεχνητή Νοημοσύνη / Μηχανική Μάθηση;"
        description_1: "Παραδοσιακά, τα προγράμματα υπολογιστών σχεδιάζονται θεσπίζοντας ακριβείς κανόνες για το τι πρέπει να κάνει το πρόγραμμα σε κάθε περίπτωση, και πώς να επεξεργαστεί τις διαθέσιμες πληροφορίες ανά πάσα στιγμή. Αυτό που είναι κοινώς γνωστό ως Τεχνητή Νοημοσύνη/Μηχανική Μάθηση είναι ένας τύπος προγραμμάτων για τα οποία αυτό που καθορίζεται ακριβώς είναι ποια είναι η εργασία που πρέπει να εκτελεστεί και πώς αξιολογείται εάν η εργασία εκτελείται καλύτερα ή χειρότερα. Σε αντίθεση όμως με τα προηγούμενα, το σύστημα ανακαλύπτει ή μαθαίνει ποια θα ήταν η πιο κατάλληλη μέθοδος για την εκτέλεση της εργασίας."
        title_2: "Τι κάνει η ενότητα Τεχνητής Νοημοσύνης / Μηχανικής Μάθησης στο CONSUL DEMOCRACY;"
        description_2: "Αυτή η ενότητα επιτρέπει την εφαρμογή οποιουδήποτε τύπου προγραμμάτων Τεχνητής Νοημοσύνης/Μηχανικής Μάθησης στο CONSUL DEMOCRACY. Τα προγράμματα μπορούν να επεξεργαστούν τις διαθέσιμες πληροφορίες στο CONSUL DEMOCRACY και να παράγουν αποτελέσματα που βοηθούν τόσο τους χρήστες όσο και τους διαχειριστές να πραγματοποιήσουν πιο αποτελεσματική και έξυπνη συμμετοχή των πολιτών. Η ενότητα αναπτύχθηκε για να διευκολύνει την εφαρμογή και την εκτέλεση νέων προγραμμάτων, διατηρώντας τον γενικό κώδικα του CONSUL DEMOCRACY και τον κώδικα αυτών των νέων προγραμμάτων ανεξάρτητα μεταξύ τους."
        title_3: "Πώς να χρησιμοποιήσετε αυτήν την ενότητα"
        description_3: "Για να τη χρησιμοποιήσετε για πρώτη φορά είναι απαραίτητο να ακολουθήσετε τις οδηγίες που είναι διαθέσιμες στην τεκμηρίωση του CONSUL DEMOCRACY για να ενεργοποιήσετε σωστά αυτήν την ενότητα. Μόλις ενεργοποιηθεί σωστά η ενότητα, τα προγράμματα εκτελούνται από την καρτέλα \"Εκτέλεση scripts\". Πριν την εκτέλεσή του, μπορούμε να δούμε στην ίδια καρτέλα μια εκτίμηση του χρόνου εκτέλεσης και άλλες σχετικές πληροφορίες. Στο τέλος της εκτέλεσης, μπορούμε να ενεργοποιήσουμε το περιεχόμενο που θα εμφανίζεται στο CONSUL DEMOCRACY από την καρτέλα \"Ρυθμίσεις\", καθώς και να κατεβάσουμε άλλα αρχεία που δημιουργήθηκαν τα οποία μπορεί να μας φανούν χρήσιμα."
        title_4: "Πώς να εφαρμόσετε νέα scripts Τεχνητής Νοημοσύνης / Μηχανικής Μάθησης"
        description_4: "Παρακαλούμε χρησιμοποιήστε προηγούμενα scripts ως παραδείγματα."
        description_4b: "Τα νέα scripts θα πρέπει να βρίσκονται στον φάκελο <code>public/machine_learning/scripts</code>"
        description_4c: "Τα δεδομένα εισόδου που θα χρησιμοποιηθούν από το script θα δημιουργηθούν ως αρχεία JSON στον φάκελο <code>../data</code>"
        description_4d: "Οποιοδήποτε παραγόμενο αποτέλεσμα θα πρέπει να τοποθετείται στον φάκελο <code>../data</code>"
        description_4e: "Συνιστάται η δημιουργία ενός ανεξάρτητου αρχείου κειμένου <code>.ini</code> με τις ρυθμίσεις του script, με το ίδιο όνομα του script και αναγνώσιμο από το configparser. Αυτό το αρχείο θα διευκολύνει την αλλαγή ρυθμίσεων από τους διαχειριστές."
        description_4f: "Συνιστάται να συμπεριλάβετε ως πρώτη γραμμή του script μια αρχική συμβολοσειρά σε τριπλά εισαγωγικά με κάποιες σύντομες πληροφορίες γι' αυτό και συνδέσμους σε τυχόν σχετικές πληροφορίες. Αυτή η συμβολοσειρά θα εμφανίζεται αυτόματα στη διεπαφή Διαχείρισης."
        description_4g: "Συνιστάται η καταγραφή των σχετικών πληροφοριών του script σε ένα αρχείο κειμένου <code>.log</code>, με το ίδιο όνομα του script."
        title_5: "Για να χρησιμοποιήσετε τα scripts Τεχνητής Νοημοσύνης / Μηχανικής Μάθησης πρέπει να έχετε εγκαταστήσει την Python στον διακομιστή σας"
        description_5: "Εδώ μπορείτε να δείτε τις υποδειγματικές οδηγίες για έναν διακομιστή Ubuntu 18.04:"
