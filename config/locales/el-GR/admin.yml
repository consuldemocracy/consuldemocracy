        info: |-
          <p>Αυτό είναι το μέρος όπου εσείς, ως διαχειριστής, εφαρμόζετε και επιβλέπετε τη διαδικασία συμμετοχής των πολιτών στην πόλη ή την περιφέρειά σας.</p>

          <p>Είστε πλέον ένας από τους εκατοντάδες φορείς τοπικής αυτοδιοίκησης και δήμους παγκοσμίως που χρησιμοποιούν την πλατφόρμα CONSUL DEMOCRACY για να κάνουν πράξη τη συμμετοχή των πολιτών. Συγχαρητήρια!</p>

          <p>Το Ίδρυμα CONSUL DEMOCRACY βρίσκεται στην καρδιά της παγκόσμιας κοινότητας χρηστών. Θα θέλαμε να σας ζητήσουμε να επικοινωνήσετε μαζί μας για να καταλάβουμε ποιος χρησιμοποιεί το λογισμικό και να δούμε πώς θα μπορούσαμε να βοηθήσουμε στην εφαρμογή ή τη χρήση του. Ανυπομονούμε να σας καλωσορίσουμε στην κοινότητα.</p>

          <p>Καλή διαχείριση!</p>

          <p>Χαιρετισμούς από την ομάδα του Ιδρύματος CONSUL DEMOCRACY.</p>
