          multiple: "Οι επικεφαλίδες προορίζονται για τον διαμοιρασμό των χρημάτων του συμμετοχικού προϋπολογισμού. Εδώ μπορείτε να προσθέσετε επικεφαλίδες για αυτή την ομάδα και να αναθέσετε το χρηματικό ποσό που θα χρησιμοποιηθεί για κάθε κεφαλίδα."
          single: "Οι επικεφαλίδες προορίζονται για το διαμοιρασμό των χρημάτων του συμμετοχικού προϋπολογισμού. Εφόσον αυτός ο προϋπολογισμός θα περιέχει μόνο μία επικεφαλίδα, εδώ ορίζετε το χρηματικό ποσό που θα δαπανηθεί σε αυτόν τον συμμετοχικό προϋπολογισμό."
