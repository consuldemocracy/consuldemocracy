el:
  sdg:
    goals:
      goal_1:
        title: "Μηδενική φτώχεια"
        title_in_two_lines: "Μηδενική φτώχεια"
        description: "Δίνουμε τέλος σε όλες τις μορφές της φτώχειας, παντού."
        long_description: '<p>Παγκοσμίως, ο αριθμός των ανθρώπων που ζουν σε συνθήκες ακραίας φτώχειας μειώθηκε από 36% το 1990 σε 10% το 2015. Ωστόσο, ο ρυθμός αλλαγής επιβραδύνεται και η κρίση του COVID-19 <a href="https://www.un.org/sites/un2.un.org/files/sg_report_socio-economic_impact_of_covid19.pdf">κινδυνεύει να ανατρέψει δεκαετίες προόδου</a> στην καταπολέμηση της φτώχειας. <a href="https://www.wider.unu.edu/node/237051">Νέα έρευνα</a> που δημοσιεύθηκε από το Παγκόσμιο Ινστιτούτο Έρευνας για την Αναπτυξιακή Οικονομία του UNU προειδοποιεί ότι οι οικονομικές επιπτώσεις από <a href="https://www.wider.unu.edu/publication/estimates-impact-covid-19-global-poverty">την παγκόσμια πανδημία θα μπορούσαν να αυξήσουν την παγκόσμια φτώχεια έως και κατά μισό δισεκατομμύριο ανθρώπους</a>, ή το 8% του συνολικού ανθρώπινου πληθυσμού. Αυτή θα ήταν η πρώτη φορά που η φτώχεια αυξάνεται παγκοσμίως σε τριάντα χρόνια, από το 1990.</p> <p>Περισσότεροι από <a href="http://www.worldbank.org/en/news/press-release/2018/09/19/decline-of-global-extreme-poverty-continues-but-has-slowed-world-bank">700 εκατομμύρια άνθρωποι</a>, ή το 10% του παγκόσμιου πληθυσμού, εξακολουθούν να ζουν σε συνθήκες ακραίας φτώχειας σήμερα, αγωνιζόμενοι να καλύψουν τις πιο βασικές ανάγκες, όπως η υγεία, η εκπαίδευση και η πρόσβαση σε νερό και αποχέτευση, μεταξύ άλλων. Η πλειονότητα των ανθρώπων που ζουν με λιγότερα από 1,90 $ την ημέρα ζουν στη υποσαχάρια Αφρική. Παγκοσμίως, το <a href="https://unstats.un.org/sdgs/report/2019/goal-01/">ποσοστό φτώχειας στις αγροτικές περιοχές είναι 17,2%</a>—πάνω από τρεις φορές υψηλότερο από ό,τι στις αστικές περιοχές.&nbsp;</p> <p>Για όσους εργάζονται, το να έχουν μια δουλειά δεν εγγυάται μια αξιοπρεπή διαβίωση. Στην πραγματικότητα, το <a href="https://unstats.un.org/sdgs/report/2019/goal-01/">8%</a> των εργαζομένων και των οικογενειών τους παγκοσμίως ζούσαν σε συνθήκες ακραίας φτώχειας το 2018. Ένα στα πέντε παιδιά ζει σε συνθήκες ακραίας φτώχειας. Η διασφάλιση κοινωνικής προστασίας για όλα τα παιδιά και άλλες ευάλωτες ομάδες είναι κρίσιμη για τη μείωση της φτώχειας.</p>'
        targets:
          target_1_1:
            long_title: "Έως το 2030, εξάλειψη της ακραίας φτώχειας για όλους τους ανθρώπους παντού, που σήμερα μετράται ως οι άνθρωποι που ζουν με λιγότερα από 1,25 $ την ημέρα"
            short_title: "Εξάλειψη της ακραίας φτώχειας"
          target_1_2:
            long_title: "Έως το 2030, μείωση τουλάχιστον κατά το ήμισυ της αναλογίας ανδρών, γυναικών και παιδιών όλων των ηλικιών που ζουν σε συνθήκες φτώχειας σε όλες τις διαστάσεις της σύμφωνα με τους εθνικούς ορισμούς"
            short_title: "Μείωση της φτώχειας τουλάχιστον κατά 50%"
          target_1_3:
            long_title: "Εφαρμογή εθνικά κατάλληλων συστημάτων και μέτρων κοινωνικής προστασίας για όλους, συμπεριλαμβανομένων των κατώτατων ορίων, και έως το 2030 επίτευξη ουσιαστικής κάλυψης των φτωχών και των ευάλωτων"
            short_title: "Εφαρμογή συστημάτων κοινωνικής προστασίας"
          target_1_4:
            long_title: "Έως το 2030, διασφάλιση ότι όλοι οι άνδρες και οι γυναίκες, ιδίως οι φτωχοί και οι ευάλωτοι, έχουν ίσα δικαιώματα σε οικονομικούς πόρους, καθώς και πρόσβαση σε βασικές υπηρεσίες, ιδιοκτησία και έλεγχο της γης και άλλων μορφών περιουσίας, κληρονομιά, φυσικούς πόρους, κατάλληλη νέα τεχνολογία και χρηματοπιστωτικές υπηρεσίες, συμπεριλαμβανομένων των μικροχρηματοδοτήσεων"
            short_title: "Ίσα δικαιώματα στην ιδιοκτησία, τις βασικές υπηρεσίες, την τεχνολογία και τους οικονομικούς πόρους"
          target_1_5:
            long_title: "Έως το 2030, ενίσχυση της ανθεκτικότητας των φτωχών και των ατόμων που βρίσκονται σε ευάλωτες καταστάσεις και μείωση της έκθεσης και της ευαλωτότητάς τους σε ακραία φαινόμενα που σχετίζονται με το κλίμα και άλλες οικονομικές, κοινωνικές και περιβαλλοντικές κρίσεις και καταστροφές"
            short_title: "Ενίσχυση της ανθεκτικότητας σε περιβαλλοντικές, οικονομικές και κοινωνικές καταστροφές"
          target_1_A:
            long_title: "Διασφάλιση σημαντικής κινητοποίησης πόρων από ποικιλία πηγών, μεταξύ άλλων μέσω της ενισχυμένης αναπτυξιακής συνεργασίας, προκειμένου να παρασχεθούν επαρκή και προβλέψιμα μέσα στις αναπτυσσόμενες χώρες, ιδίως στις λιγότερο αναπτυγμένες χώρες, για την εφαρμογή προγραμμάτων και πολιτικών για την τερμάτιση της φτώχειας σε όλες τις διαστάσεις της"
            short_title: "Κινητοποίηση πόρων για την εφαρμογή πολιτικών για την εξάλειψη της φτώχειας"
          target_1_B:
            long_title: "Δημιουργία ισχυρών πλαισίων πολιτικής σε εθνικό, περιφερειακό και διεθνές επίπεδο, βασισμένων σε αναπτυξιακές στρατηγικές υπέρ των φτωχών και ευαίσθητες ως προς το φύλο, για την υποστήριξη επιταχυνόμενων επενδύσεων σε δράσεις εξάλειψης της φτώχειας"
            short_title: "Δημιουργία πλαισίων πολιτικής υπέρ των φτωχών και ευαίσθητων ως προς το φύλο"
      goal_2:
        title: "Μηδενική πείνα"
        title_in_two_lines: "Μηδενική\nΠείνα"
        description: "Μηδενική πείνα."
        long_description: '<p>Μετά από δεκαετίες σταθερής μείωσης, ο αριθμός των ανθρώπων που υποφέρουν από πείνα – όπως μετράται από τον επιπολασμό του υποσιτισμού – άρχισε να αυξάνεται ξανά αργά το 2015. Οι τρέχουσες εκτιμήσεις δείχνουν ότι <a href="http://www.fao.org/publications/sofi/2020/en/">σχεδόν 690 εκατομμύρια άνθρωποι πεινούν, ή το 8,9% του παγκόσμιου πληθυσμού</a> – αυξημένος κατά 10 εκατομμύρια ανθρώπους σε ένα χρόνο και κατά σχεδόν 60 εκατομμύρια σε πέντε χρόνια.</p> <p>Ο κόσμος δεν βρίσκεται σε τροχιά επίτευξης της Μηδενικής Πείνας έως το 2030. Εάν οι πρόσφατες τάσεις συνεχιστούν, ο αριθμός των ανθρώπων που επηρεάζονται από την πείνα θα ξεπεράσει τα 840 εκατομμύρια έως το 2030.</p> <p>Σύμφωνα με το Παγκόσμιο Πρόγραμμα Τροφίμων, <a href="https://www.wfp.org/publications/2020-global-report-food-crises">135 εκατομμύρια υποφέρουν από οξεία πείνα</a> κυρίως λόγω ανθρωπογενών συγκρούσεων, κλιματικής αλλαγής και οικονομικής ύφεσης. Η πανδημία COVID-19 θα μπορούσε τώρα να διπλασιάσει αυτόν τον αριθμό, θέτοντας επιπλέον 130 εκατομμύρια ανθρώπους σε κίνδυνο να υποστούν οξεία πείνα έως το τέλος του 2020.</p> <p>Με περισσότερα από <a href="https://insight.wfp.org/covid-19-will-almost-double-people-in-acute-hunger-by-end-of-2020-59df0c4a8072">ένα τέταρτο του δισεκατομμυρίου ανθρώπων πιθανώς στα πρόθυρα της λιμοκτονίας</a>, πρέπει να ληφθεί άμεση δράση για την παροχή τροφίμων και ανθρωπιστικής βοήθειας στις περιοχές που βρίσκονται σε μεγαλύτερο κίνδυνο.</p> <p>Παράλληλα,&nbsp;απαιτείται μια βαθιά αλλαγή του παγκόσμιου συστήματος τροφίμων και γεωργίας εάν θέλουμε να θρέψουμε τα περισσότερα από 690 εκατομμύρια ανθρώπους που πεινούν σήμερα – και τα&nbsp;<a href="https://www.un.org/development/desa/en/news/population/world-population-prospects-2019.html">επιπλέον 2 δισεκατομμύρια ανθρώπους</a>&nbsp;που θα έχει ο κόσμος έως το 2050. Η αύξηση της γεωργικής παραγωγικότητας και η βιώσιμη παραγωγή τροφίμων είναι κρίσιμης σημασίας για την ελάφρυνση των κινδύνων της πείνας.</p>'
        targets:
          target_2_1:
            long_title: "Έως το 2030, τερματισμός της πείνας και διασφάλιση της πρόσβασης όλων των ανθρώπων, ιδίως των φτωχών και των ανθρώπων σε ευάλωτες καταστάσεις, συμπεριλαμβανομένων των βρεφών, σε ασφαλή, θρεπτικά και επαρκή τρόφιμα καθ' όλη τη διάρκεια του έτους."
            short_title: "Καθολική πρόσβαση σε ασφαλή και θρεπτικά τρόφιμα"
          target_2_2:
            long_title: "Έως το 2030, τερματισμός όλων των μορφών κακοσιτισμού, συμπεριλαμβανομένης της επίτευξης, έως το 2025, των διεθνώς συμφωνημένων στόχων για τη σωματική καχεξία και την καχεξία στα παιδιά κάτω των 5 ετών, και αντιμετώπιση των διατροφικών αναγκών των εφήβων κοριτσιών, των εγκύων και θηλαζουσών γυναικών και των ηλικιωμένων."
            short_title: "Τερματισμός όλων των μορφών κακοσιτισμού"
          target_2_3:
            long_title: "Έως το 2030, διπλασιασμός της γεωργικής παραγωγικότητας και των εισοδημάτων των μικρών παραγωγών τροφίμων, ιδίως των γυναικών, των αυτόχθονων πληθυσμών, των οικογενειακών αγροτών, των κτηνοτρόφων και των αλιέων, μεταξύ άλλων μέσω ασφαλούς και ίσης πρόσβασης στη γη, σε άλλους παραγωγικούς πόρους και εισροές, γνώσεις, χρηματοπιστωτικές υπηρεσίες, αγορές και ευκαιρίες για προστιθέμενη αξία και μη γεωργική απασχόληση."
            short_title: "Διπλασιασμός της παραγωγικότητας και των εισοδημάτων των μικρών παραγωγών τροφίμων"
          target_2_4:
            long_title: "Έως το 2030, διασφάλιση βιώσιμων συστημάτων παραγωγής τροφίμων και εφαρμογή ανθεκτικών γεωργικών πρακτικών που αυξάνουν την παραγωγικότητα και την παραγωγή, που βοηθούν στη διατήρηση των οικοσυστημάτων, που ενισχύουν την ικανότητα προσαρμογής στην κλιματική αλλαγή, τα ακραία καιρικά φαινόμενα, τη ξηρασία, τις πλημμύρες και άλλες καταστροφές και που βελτιώνουν σταδιακά την ποιότητα της γης και του εδάφους."
            short_title: "Βιώσιμη παραγωγή τροφίμων και ανθεκτικές γεωργικές πρακτικές"
          target_2_5:
            long_title: "Έως το 2020, διατήρηση της γενετικής ποικιλότητας των σπόρων, των καλλιεργούμενων φυτών και των εκτρεφόμενων και εξημερωμένων ζώων και των σχετικών άγριων ειδών τους, μεταξύ άλλων μέσω σωστά διαχειριζόμενων και διαφοροποιημένων τραπεζών σπόρων και φυτών σε εθνικό, περιφερειακό και διεθνές επίπεδο, και προώθηση της πρόσβασης και της δίκαιης και ισότιμης κατανομής των οφελών που προκύπτουν από τη χρησιμοποίηση των γενετικών πόρων και των σχετικών παραδοσιακών γνώσεων, όπως έχει συμφωνηθεί διεθνώς."
            short_title: "Διατήρηση της γενετικής ποικιλότητας στην παραγωγή τροφίμων"
          target_2_A:
            long_title: "Αύξηση των επενδύσεων, μεταξύ άλλων μέσω ενισχυμένης διεθνούς συνεργασίας, σε αγροτικές υποδομές, γεωργική έρευνα και υπηρεσίες επέκτασης, τεχνολογική ανάπτυξη και τράπεζες γονιδίων φυτών και ζώων, προκειμένου να ενισχυθεί η γεωργική παραγωγική ικανότητα στις αναπτυσσόμενες χώρες, ιδίως στις λιγότερο αναπτυγμένες χώρες."
            short_title: "Επένδυση σε αγροτικές υποδομές, γεωργική έρευνα, τεχνολογία και τράπεζες γονιδίων"
          target_2_B:
            long_title: "Διόρθωση και πρόληψη των εμπορικών περιορισμών και στρεβλώσεων στις παγκόσμιες γεωργικές αγορές, μεταξύ άλλων μέσω της παράλληλης εξάλειψης όλων των μορφών γεωργικών εξαγωγικών επιδοτήσεων και όλων των εξαγωγικών μέτρων με ισοδύναμο αποτέλεσμα, σύμφωνα με τη εντολή του Γύρου της Ντόχα για την Ανάπτυξη."
            short_title: "Πρόληψη γεωργικών εμπορικών περιορισμών, στρεβλώσεων της αγοράς και εξαγωγικών επιδοτήσεων"
          target_2_C:
            long_title: "Υιοθέτηση μέτρων για τη διασφάλιση της σωστής λειτουργίας των αγορών βασικών αγροτικών προϊόντων και των παραγώγων τους και διευκόλυνση της έγκαιρης πρόσβασης σε πληροφορίες της αγοράς, συμπεριλαμβανομένων των αποθεμάτων τροφίμων, προκειμένου να περιοριστεί η ακραία μεταβλητότητα των τιμών των τροφίμων."
            short_title: "Διασφάλιση σταθερών αγορών βασικών αγροτικών προϊόντων και έγκαιρη πρόσβαση σε πληροφορίες"
      goal_3:
        title: "Καλή υγεία και ευημερία"
        title_in_two_lines: "Καλή Υγεία\nκαι Ευημερία"
        description: "Διασφάλιση υγιούς ζωής και προώθηση της ευημερίας για όλους σε όλες τις ηλικίες."
        long_description: '<p>Η διασφάλιση υγιούς ζωής και η προώθηση της ευημερίας σε όλες τις ηλικίες είναι απαραίτητη για τη βιώσιμη ανάπτυξη. Επί του παρόντος, ο κόσμος αντιμετωπίζει μια <a href="https://www.un.org/coronavirus">παγκόσμια κρίση υγείας</a> που δεν μοιάζει με καμία άλλη — ο COVID-19 εξαπλώνει τον ανθρώπινο πόνο, αποσταθεροποιεί την παγκόσμια οικονομία και ανατρέπει τις ζωές δισεκατομμυρίων ανθρώπων σε όλο τον κόσμο.&nbsp;</p> <p>Πριν από την πανδημία, σημειώθηκε σημαντική πρόοδος στη <a href="https://unstats.un.org/sdgs/report/2019/goal-03/">βελτίωση της υγείας εκατομμυρίων ανθρώπων</a>. Σημαντικά βήματα έγιναν στην αύξηση του προσδόκιμου ζωής και στη μείωση ορισμένων από τις κοινές αιτίες θανάτου που σχετίζονται με την παιδική και μητρική θνησιμότητα. Αλλά απαιτούνται περισσότερες προσπάθειες για την πλήρη εξάλειψη ευρέος φάσματος ασθενειών και την αντιμετώπιση πολλών διαφορετικών επιμενόντων και εμφανιζόμενων θεμάτων υγείας. Εστιάζοντας στην παροχή αποτελεσματικότερης χρηματοδότησης των συστημάτων υγείας, τη βελτιωμένη αποχέτευση και υγιεινή, και την αυξημένη πρόσβαση σε ιατρούς, μπορεί να σημειωθεί σημαντική πρόοδος στην παροχή βοήθειας για τη σωτηρία εκατομμυρίων ζωών.</p> <p>Έκτακτες ανάγκες υγείας, όπως ο COVID-19, συνιστούν παγκόσμιο κίνδυνο και έχουν αναδείξει την κρίσιμη ανάγκη για ετοιμότητα. Το Πρόγραμμα των Ηνωμένων Εθνών για την Ανάπτυξη υπογράμμισε τεράστιες ανισότητες στις <a href="https://www.undp.org/content/undp/en/home/news-centre/news/2020/COVID19_UNDP_data_dashboards_reveal_disparities_among_countries_to_cope_and_recover.html">ικανότητες των χωρών να αντιμετωπίσουν και να ανακάμψουν από την κρίση του COVID-19</a>. Η πανδημία αποτελεί σημείο καμπής για την ετοιμότητα έναντι εκτάκτων αναγκών υγείας και για επενδύσεις σε κρίσιμες δημόσιες υπηρεσίες του 21ου αιώνα.&nbsp;</p>'
        targets:
          target_3_1:
            long_title: "Έως το 2030, μείωση του παγκόσμιου δείκτη μητρικής θνησιμότητας σε λιγότερους από 70 ανά 100.000 ζώντες γεννήσεις."
            short_title: "Μείωση της μητρικής θνησιμότητας"
          target_3_2:
            long_title: "Έως το 2030, τερματισμός των αποτρέψιμων θανάτων νεογνών και παιδιών κάτω των 5 ετών, με όλες τις χώρες να στοχεύουν στη μείωση της νεογνικής θνησιμότητας σε τουλάχιστον 12 ανά 1.000 ζώντες γεννήσεις και της θνησιμότητας κάτω των 5 ετών σε τουλάχιστον 25 ανά 1.000 ζώντες γεννήσεις."
            short_title: "Τερματισμός όλων των αποτρέψιμων θανάτων κάτω των 5 ετών"
          target_3_3:
            long_title: "Έως το 2030, τερματισμός των επιδημιών του AIDS, της φυματίωσης, της ελονοσίας και των παραμελημένων τροπικών ασθενειών και καταπολέμηση της ηπατίτιδας, των υδατογενών ασθενειών και άλλων μεταδοτικών ασθενειών."
            short_title: "Καταπολέμηση μεταδοτικών ασθενειών"
          target_3_4:
            long_title: "Έως το 2030, μείωση κατά ένα τρίτο της πρόωρης θνησιμότητας από μη μεταδοτικές ασθένειες μέσω της πρόληψης και της θεραπείας και προώθηση της ψυχικής υγείας και ευημερίας."
            short_title: "Μείωση της θνησιμότητας από μη μεταδοτικές ασθένειες και προώθηση της ψυχικής υγείας"
          target_3_5:
            long_title: "Ενίσχυση της πρόληψης και της θεραπείας της κατάχρησης ουσιών, συμπεριλαμβανομένης της κατάχρησης ναρκωτικών φαρμάκων και της επιβλαβούς χρήσης αλκοόλ."
            short_title: "Πρόληψη και θεραπεία της κατάχρησης ουσιών"
          target_3_6:
            long_title: "Έως το 2020, υποδιπλασιασμός του αριθμού των παγκόσμιων θανάτων και τραυματισμών από τροχαία ατυχήματα."
            short_title: "Μείωση των τραυματισμών και θανάτων από τροχαία"
          target_3_7:
            long_title: "Έως το 2030, διασφάλιση της καθολικής πρόσβασης σε υπηρεσίες σεξουαλικής και αναπαραγωγικής φροντίδας υγείας, συμπεριλαμβανομένου του οικογενειακού προγραμματισμού, της ενημέρωσης και της εκπαίδευσης, καθώς και της ενσωμάτωσης της αναπαραγωγικής υγείας σε εθνικές στρατηγικές και προγράμματα."
            short_title: "Καθολική πρόσβαση σε σεξουαλική και αναπαραγωγική φροντίδα, οικογενειακό προγραμματισμό και εκπαίδευση"
          target_3_8:
            long_title: "Επίτευξη καθολικής υγειονομικής κάλυψης, συμπεριλαμβανομένης της προστασίας από οικονομικούς κινδύνους, της πρόσβασης σε ποιοτικές βασικές υπηρεσίες φροντίδας υγείας και της πρόσβασης σε ασφαλή, αποτελεσματικά, ποιοτικά και προσιτά βασικά φάρμακα και εμβόλια για όλους."
            short_title: "Επίτευξη καθολικής υγειονομικής κάλυψης"
          target_3_9:
            long_title: "Έως το 2030, ουσιαστική μείωση του αριθμού των θανάτων και ασθενειών από επικίνδυνες χημικές ουσίες και τη μόλυνση και ρύπανση του αέρα, του νερού και του εδάφους."
            short_title: "Μείωση των ασθενειών και θανάτων από επικίνδυνες χημικές ουσίες και ρύπανση"
          target_3_A:
            long_title: "Ενίσχυση της εφαρμογής της Σύμβασης-Πλαισίου του Παγκόσμιου Οργανισμού Υγείας για τον Έλεγχο του Καπνού σε όλες τις χώρες, ανάλογα με την περίπτωση."
            short_title: "Εφαρμογή της Σύμβασης-Πλαισίου του ΠΟΥ για τον Έλεγχο του Καπνού"
          target_3_B:
            long_title: "Υποστήριξη της έρευνας και ανάπτυξης εμβολίων και φαρμάκων για τις μεταδοτικές και μη μεταδοτικές ασθένειες που επηρεάζουν πρωτίστως τις αναπτυσσόμενες χώρες, παροχή πρόσβασης σε προσιτά βασικά φάρμακα και εμβόλια, σύμφωνα με τη Διακήρυξη της Ντόχα για τη Συμφωνία TRIPS και τη Δημόσια Υγεία, η οποία επιβεβαιώνει το δικαίωμα των αναπτυσσόμενων χωρών να χρησιμοποιούν στο έπακρο τις διατάξεις της Συμφωνίας για τα Δικαιώματα Πνευματικής Ιδιοκτησίας στον Τομέα του Εμπορίου όσον αφορά τις ευελιξίες για την προστασία της δημόσιας υγείας και, ιδίως, την παροχή πρόσβασης σε φάρμακα για όλους."
            short_title: "Υποστήριξη της έρευνας, της ανάπτυξης και της καθολικής πρόσβασης σε προσιτά εμβόλια και φάρμακα"
          target_3_C:
            long_title: "Ουσιαστική αύξηση της χρηματοδότησης της υγείας και της πρόσληψης, ανάπτυξης, κατάρτισης και διατήρησης του εργατικού δυναμικού στον τομέα της υγείας στις αναπτυσσόμενες χώρες, ειδικά στις λιγότερο αναπτυγμένες χώρες και στα μικρά νησιωτικά αναπτυσσόμενα Κράτη."
            short_title: "Αύξηση της χρηματοδότησης της υγείας και υποστήριξη του υγειονομικού προσωπικού στις αναπτυσσόμενες χώρες"
          target_3_D:
            long_title: "Ενίσχυση της ικανότητας όλων των χωρών, ιδίως των αναπτυσσόμενων χωρών, για έγκαιρη προειδοποίηση, μείωση κινδύνου και διαχείριση εθνικών και παγκόσμιων κινδύνων υγείας."
            short_title: "Βελτίωση συστημάτων έγκαιρης προειδοποίησης για παγκόσμιους κινδύνους υγείας"
      goal_4:
        title: "Ποιοτική εκπαίδευση"
        title_in_two_lines: "Ποιοτική\nΕκπαίδευση"
        description: "Ποιοτική Εκπαίδευση."
        long_description: '<p>Η εκπαίδευση επιτρέπει την ανοδική κοινωνικοοικονομική κινητικότητα και αποτελεί κλειδί για τη διαφυγή από τη φτώχεια. Την τελευταία δεκαετία, σημειώθηκε σημαντική πρόοδος προς την αύξηση της πρόσβασης στην εκπαίδευση και των ποσοστών εγγραφής στα σχολεία σε όλα τα επίπεδα, ιδιαίτερα για τα κορίτσια. Παρόλα αυτά, <a href="http://uis.unesco.org/en/topic/out-school-children-and-youth">περίπου 260 εκατομμύρια παιδιά βρίσκονταν ακόμα εκτός σχολείου</a> το 2018 — σχεδόν το ένα πέμπτο του παγκόσμιου πληθυσμού σε αυτήν την ηλικιακή ομάδα. Και περισσότερα από τα μισά παιδιά και εφήβους παγκοσμίως <a href="https://unstats.un.org/sdgs/report/2019/goal-04/">δεν πληρούν τα ελάχιστα πρότυπα επάρκειας</a> στην ανάγνωση και τα μαθηματικά.&nbsp;</p> <p>Το 2020, καθώς η πανδημία COVID-19 εξαπλώθηκε σε όλο τον κόσμο, η πλειονότητα των χωρών ανακοίνωσε το προσωρινό κλείσιμο των σχολείων, επηρεάζοντας περισσότερο από το 91% των μαθητών παγκοσμίως. Έως τον Απρίλιο του 2020, σχεδόν <a href="https://en.unesco.org/covid19/educationresponse">1,6 δισεκατομμύρια παιδιά και νέοι ήταν εκτός σχολείου</a>. Και σχεδόν <a href="https://www.un.org/sites/un2.un.org/files/policy_brief_on_covid_impact_on_children_16_april_2020.pdf">369 εκατομμύρια παιδιά που βασίζονται στα σχολικά γεύματα</a> έπρεπε να αναζητήσουν άλλες πηγές για την καθημερινή τους διατροφή.&nbsp;</p> <p>Ποτέ στο παρελθόν δεν βρίσκονταν τόσο πολλά παιδιά εκτός σχολείου ταυτόχρονα, διακόπτοντας τη μάθηση και ανατρέποντας ζωές, ειδικά των πιο ευάλωτων και περιθωριοποιημένων. Η παγκόσμια πανδημία έχει ευρείες συνέπειες που ενδέχεται να θέσουν σε κίνδυνο τα σκληρά κερδισμένα οφέλη που σημειώθηκαν στη βελτίωση της παγκόσμιας εκπαίδευσης.</p>'
        targets:
          target_4_1:
            long_title: "Έως το 2030, διασφάλιση ότι όλα τα κορίτσια και τα αγόρια ολοκληρώνουν δωρεάν, ισότιμη και ποιοτική πρωτοβάθμια και δευτεροβάθμια εκπαίδευση που οδηγεί σε σχετικό και αποτελεσματικό για τον Στόχο-4 μαθησιακό αποτέλεσμα."
            short_title: "Δωρεάν πρωτοβάθμια και δευτεροβάθμια εκπαίδευση"
          target_4_2:
            long_title: "Έως το 2030, διασφάλιση ότι όλα τα κορίτσια και τα αγόρια έχουν πρόσβαση σε ποιοτική ανάπτυξη της πρώιμης παιδικής ηλικίας, φροντίδα και προσχολική εκπαίδευση ώστε να είναι έτοιμα για την πρωτοβάθμια εκπαίδευση."
            short_title: "Ίση πρόσβαση σε ποιοτική προσχολική εκπαίδευση"
          target_4_3:
            long_title: "Έως το 2030, διασφάλιση ίσης πρόσβασης για όλες τις γυναίκες και τους άνδρες σε προσιτή και ποιοτική τεχνική, επαγγελματική και τριτοβάθμια εκπαίδευση, συμπεριλαμβανομένου του πανεπιστημίου."
            short_title: "Ίση πρόσβαση σε προσιτή τεχνική, επαγγελματική και ανώτατη εκπαίδευση"
          target_4_4:
            long_title: "Έως το 2030, ουσιαστική αύξηση του αριθμού των νέων και των ενηλίκων που διαθέτουν σχετικές δεξιότητες, συμπεριλαμβανομένων των τεχνικών και επαγγελματικών δεξιοτήτων, για απασχόληση, αξιοπρεπείς θέσεις εργασίας και επιχειρηματικότητα."
            short_title: "Αύξηση του αριθμού ατόμων με σχετικές δεξιότητες για οικονομική επιτυχία"
          target_4_5:
            long_title: "Έως το 2030, εξάλειψη των ανισοτήτων μεταξύ των φύλων στην εκπαίδευση και διασφάλιση ίσης πρόσβασης σε όλα τα επίπεδα εκπαίδευσης και επαγγελματικής κατάρτισης για τους ευάλωτους, συμπεριλαμβανομένων των ατόμων με αναπηρία, των αυτόχθονων πληθυσμών και των παιδιών σε ευάλωτες καταστάσεις."
            short_title: "Εξάλειψη όλων των διακρίσεων στην εκπαίδευση"
          target_4_6:
            long_title: "Έως το 2030, διασφάλιση ότι όλοι οι νέοι και ένα σημαντικό ποσοστό ενηλίκων, τόσο άνδρες όσο και γυναίκες, επιτυγχάνουν γραμματισμό και αριθμητισμό."
            short_title: "Καθολικός γραμματισμός και αριθμητισμός"
          target_4_7:
            long_title: "Έως το 2030, διασφάλιση ότι όλοι οι εκπαιδευόμενοι αποκτούν τις γνώσεις και τις δεξιότητες που χρειάζονται για την προώθηση της βιώσιμης ανάπτυξης, μεταξύ άλλων μέσω της εκπαίδευσης για τη βιώσιμη ανάπτυξη και τους βιώσιμους τρόπους ζωής, τα ανθρώπινα δικαιώματα, την ισότητα των φύλων, την προώθηση μιας κουλτούρας ειρήνης και μη βίας, την παγκόσμια ιθαγένεια και την εκτίμηση της πολιτιστικής ποικιλομορφίας και της συμβολής του πολιτισμού στη βιώσιμη ανάπτυξη."
            short_title: "Εκπαίδευση για τη βιώσιμη ανάπτυξη και την παγκόσμια ιθαγένεια"
          target_4_A:
            long_title: "Δημιουργία και αναβάθμιση εκπαιδευτικών εγκαταστάσεων που είναι ευαίσθητες στα παιδιά, την αναπηρία και το φύλο και παρέχουν ασφαλή, μη βίαια, συμπεριληπτικά και αποτελεσματικά μαθησιακά περιβάλλοντα για όλους."
            short_title: "Δημιουργία και αναβάθμιση συμπεριληπτικών και ασφαλών σχολείων"
          target_4_B:
            long_title: "Έως το 2020, ουσιαστική διεύρυνση παγκοσμίως του αριθμού των υποτροφιών που είναι διαθέσιμες σε αναπτυσσόμενες χώρες, ιδίως στις λιγότερο αναπτυγμένες χώρες, τα μικρά νησιωτικά αναπτυσσόμενα Κράτη και τις αφρικανικές χώρες, για εγγραφή στην ανώτατη εκπαίδευση, συμπεριλαμβανομένης της επαγγελματικής κατάρτισης και προγραμμάτων τεχνολογίας πληροφοριών και επικοινωνιών, τεχνικών, μηχανικών και επιστημονικών προγραμμάτων, σε αναπτυγμένες χώρες και άλλες αναπτυσσόμενες χώρες."
            short_title: "Διεύρυνση υποτροφιών ανώτατης εκπαίδευσης για τις αναπτυσσόμενες χώρες"
          target_4_C:
            long_title: "Έως το 2030, ουσιαστική αύξηση της προσφοράς προσοντούχων εκπαιδευτικών, μεταξύ άλλων μέσω διεθνούς συνεργασίας για την κατάρτιση εκπαιδευτικών στις αναπτυσσόμενες χώρες, ειδικά στις λιγότερο αναπτυγμένες χώρες και στα μικρά νησιωτικά αναπτυσσόμενα κράτη."
            short_title: "Αύξηση της προσφοράς προσοντούχων εκπαιδευτικών στις αναπτυσσόμενες χώρες"
      goal_5:
        title: "Ισότητα των φύλων"
        title_in_two_lines: "Ισότητα των\nΦύλων"
        description: "Επίτευξη της ισότητας των φύλων και ενδυνάμωση όλων των γυναικών και κοριτσιών."
        long_description: '<p>Η ισότητα των φύλων δεν είναι μόνο ένα θεμελιώδες ανθρώπινο δικαίωμα, αλλά και απαραίτητο θεμέλιο για έναν ειρηνικό, ευημερούντα και βιώσιμο κόσμο.&nbsp;</p> <p>Υπήρξε <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?la=en&amp;vs=935">πρόοδος</a> τις τελευταίες δεκαετίες: Περισσότερα κορίτσια πηγαίνουν στο σχολείο, λιγότερα κορίτσια εξαναγκάζονται σε πρόωρο γάμο, περισσότερες γυναίκες υπηρετούν στο κοινοβούλιο και σε θέσεις ηγεσίας, και οι νόμοι μεταρρυθμίζονται για την προώθηση της ισότητας των φύλων.&nbsp;</p> <p>Παρά αυτά τα οφέλη, πολλές <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/gender-equality-womens-rights-in-review-key-facts-and-figures-en.pdf?la=en&amp;vs=935">προκλήσεις</a> παραμένουν: οι εισαγωγικές διακρίσεις στους νόμους και οι κοινωνικές νόρμες παραμένουν διάχυτες, οι γυναίκες συνεχίζουν να υποεκπροσωπούνται σε όλα τα επίπεδα πολιτικής ηγεσίας, και 1 στις 5 γυναίκες και κορίτσια ηλικίας 15 έως 49 ετών αναφέρουν ότι έχουν υποστεί σωματική ή σεξουαλική βία από ερωτικό σύντροφο εντός περιόδου 12 μηνών.</p> <p>Οι επιπτώσεις της <a href="https://www.un.org/sites/un2.un.org/files/policy_brief_on_covid_impact_on_women_9_apr_2020_updated.pdf">πανδημίας COVID-19 θα μπορούσαν να ανατρέψουν τη περιορισμένη πρόοδο</a> που έχει σημειωθεί στην ισότητα των φύλων και τα δικαιώματα των γυναικών.&nbsp; Η ξεσπάσασα επιδημία του κορωνοϊού <a href="https://www.unfpa.org/sites/default/files/resource-pdf/COVID-19_A_Gender_Lens_Guidance_Note.pdf">επιδεινώνει τις υπάρχουσες ανισότητες</a> για τις γυναίκες και τα κορίτσια σε κάθε σφαίρα – από την υγεία και την οικονομία, έως την ασφάλεια και την κοινωνική προστασία.&nbsp;</p> <p>Οι γυναίκες διαδραματίζουν δυσανάλογο ρόλο στην ανταπόκριση στον ιό, συμπεριλαμβανομένων ως εργαζόμενες υγειονομικής περίθαλψης στην πρώτη γραμμή και φροντιστές στο σπίτι. Η απλήρωτη εργασία φροντίδας των γυναικών έχει αυξηθεί σημαντικά ως αποτέλεσμα του κλεισίματος των σχολείων και των αυξημένων αναγκών των ηλικιωμένων. Οι γυναίκες πλήττονται επίσης σκληρότερα από τις οικονομικές επιπτώσεις του COVID-19, καθώς εργάζονται δυσανάλογα σε αβέβαιες αγορές εργασίας. Σχεδόν το 60% των γυναικών εργάζονται στην άτυπη οικονομία, γεγονός που τις θέτει σε μεγαλύτερο κίνδυνο να πέσουν στη φτώχεια.&nbsp;</p> <p>Η πανδημία οδήγησε επίσης σε απότομη αύξηση της <a href="https://www.unwomen.org/-/media/headquarters/attachments/sections/library/publications/2020/issue-brief-covid-19-and-ending-violence-against-women-and-girls-en.pdf?la=en&amp;vs=5006">βίας κατά των γυναικών και των κοριτσιών</a>. Με τα μέτρα απαγόρευσης κυκλοφορίας σε ισχύ, πολλές γυναίκες είναι παγιδευμένες στο σπίτι με τους θύτες τους, αγωνιζόμενες να αποκτήσουν πρόσβαση σε υπηρεσίες που υποφέρουν από περικοπές και περιορισμούς. Τα αναδυόμενα δεδομένα δείχνουν ότι, από το ξέσπασμα της πανδημίας, η βία κατά των γυναικών και των κοριτσιών – και ιδιαίτερα η ενδοοικογενειακή βία – έχει ενταθεί.</p>'
        targets:
          target_5_1:
            long_title: "Τερματισμός όλων των μορφών διακρίσεων κατά όλων των γυναικών και κοριτσιών παντού."
            short_title: "Τερματισμός των διακρίσεων κατά των γυναικών και των κοριτσιών"
          target_5_2:
            long_title: "Εξάλειψη όλων των μορφών βίας κατά όλων των γυναικών και κοριτσιών στη δημόσια και ιδιωτική σφαίρα, συμπεριλαμβανομένης της εμπορίας ανθρώπων και της σεξουαλικής και άλλων τύπων εκμετάλλευσης."
            short_title: "Τερματισμός κάθε μορφής βίας και εκμετάλλευσης γυναικών και κοριτσιών"
          target_5_3:
            long_title: "Εξάλειψη όλων των επιβλαβών πρακτικών, όπως ο παιδικός, ο πρόωρος και ο καταναγκαστικός γάμος και ο ακρωτηριασμός των γυναικείων γεννητικών οργάνων."
            short_title: "Εξάλειψη των καταναγκαστικών γάμων και του ακρωτηριασμού των γεννητικών οργάνων"
          target_5_4:
            long_title: "Αναγνώριση και εκτίμηση της απλήρωτης φροντίδας και της οικιακής εργασίας μέσω της παροχής δημόσιων υπηρεσιών, υποδομών και πολιτικών κοινωνικής προστασίας και της προώθησης της κοινής ευθύνης εντός του νοικοκυριού και της οικογένειας, όπως αρμόζει σε εθνικό επίπεδο."
            short_title: "Αναγνώριση της απλήρωτης φροντίδας και προώθηση των κοινών οικιακών ευθυνών"
          target_5_5:
            long_title: "Διασφάλιση της πλήρους και αποτελεσματικής συμμετοχής των γυναικών και των ίσων ευκαιριών για ηγεσία σε όλα τα επίπεδα λήψης αποφάσεων στην πολιτική, οικονομική και δημόσια ζωή."
            short_title: "Διασφάλιση πλήρους συμμετοχής στην ηγεσία και τη λήψη αποφάσεων"
          target_5_6:
            long_title: "Διασφάλιση της καθολικής πρόσβασης στη σεξουαλική και αναπαραγωγική υγεία και στα αναπαραγωγικά δικαιώματα, όπως έχει συμφωνηθεί σύμφωνα με το Πρόγραμμα Δράσης της Διεθνούς Διάσκεψης για τον Πληθυσμό και την Ανάπτυξη και την Πλατφόρμα Δράσης του Πεκίνου και τα έγγραφα αποτελεσμάτων των αναθεωρητικών διασκέψεών τους."
            short_title: "Καθολική πρόσβαση στην αναπαραγωγική υγεία και τα αναπαραγωγικά δικαιώματα"
          target_5_A:
            long_title: "Ανάληψη μεταρρυθμίσεων για να δοθούν στις γυναίκες ίσα δικαιώματα σε οικονομικούς πόρους, καθώς και πρόσβαση στην ιδιοκτησία και τον έλεγχο της γης και άλλων μορφών περιουσίας, στις χρηματοπιστωτικές υπηρεσίες, την κληρονομιά και τους φυσικούς πόρους, σύμφωνα με τη εθνική νομοθεσία."
            short_title: "Ίσα δικαιώματα σε οικονομικούς πόρους, ιδιοκτησία περιουσίας και χρηματοπιστωτικές υπηρεσίες"
          target_5_B:
            long_title: "Ενίσχυση της χρήσης τεχνολογιών διευκόλυνσης, ιδίως της τεχνολογίας πληροφοριών και επικοινωνιών, για την προώθηση της ενδυνάμωσης των γυναικών."
            short_title: "Προώθηση της ενδυνάμωσης των γυναικών μέσω της τεχνολογίας"
          target_5_C:
            long_title: "Υιοθέτηση και ενίσχυση ισχυρών πολιτικών και εφαρμοστείας νομοθεσίας για την προώθηση της ισότητας των φύλων και την ενδυνάμωση όλων των γυναικών και κοριτσιών σε όλα τα επίπεδα."
            short_title: "Υιοθέτηση και ενίσχυση πολιτικών και εφαρμοστείας νομοθεσίας για την ισότητα των φύλων"
      goal_6:
        title: "Καθαρό νερό και αποχέτευση"
        title_in_two_lines: "Καθαρό Νερό\nκαι Αποχέτευση"
        description: "Διασφάλιση της πρόσβασης σε νερό και αποχέτευση για όλους."
        long_description: '<p>Παρόλο που έχει σημειωθεί σημαντική πρόοδος στην αύξηση της πρόσβασης σε καθαρό πόσιμο νερό και αποχέτευση, δισεκατομμύρια άνθρωποι —κυρίως σε αγροτικές περιοχές— εξακολουθούν να στερούνται αυτές τις βασικές υπηρεσίες. Παγκοσμίως, <a href="https://www.who.int/news-room/detail/18-06-2019-1-in-3-people-globally-do-not-have-access-to-safe-drinking-water-unicef-who">ένας στους τρεις ανθρώπους δεν έχει πρόσβαση σε ασφαλές πόσιμο νερό</a>, <a href="https://www.unwater.org/water-facts/water-sanitation-and-hygiene/">δύο στους πέντε ανθρώπους δεν διαθέτουν βασική εγκατάσταση πλυσίματος χεριών</a> με σαπούνι και νερό, και περισσότεροι από <a href="https://news.un.org/en/story/2019/11/1051561">673 εκατομμύρια άνθρωποι εξακολουθούν να αφοδεύουν στο ύπαιθρο</a>.</p> <p>Η πανδημία COVID-19 απέδειξε την κρίσιμη σημασία της αποχέτευσης, της υγιεινής και της επαρκούς πρόσβασης σε καθαρό νερό για την πρόληψη και τον περιορισμό των ασθενειών. <a href="https://www.unwater.org/water-facts/handhygiene/">Η υγιεινή των χεριών σώζει ζωές</a>. Σύμφωνα με τον Παγκόσμιο Οργανισμό Υγείας, <a href="https://www.who.int/news-room/events/detail/2020/05/05/default-calendar/hand-hygiene-day">το πλύσιμο των χεριών είναι μία από τις πιο αποτελεσματικές δράσεις που μπορείτε να λάβετε</a> για τη μείωση της εξάπλωσης παθογόνων και την πρόληψη λοιμώξεων, συμπεριλαμβανομένου του ιού COVID-19. Ωστόσο, δισεκατομμύρια άνθρωποι εξακολουθούν να στερούνται ασφαλή αποχέτευση νερού, και η χρηματοδότηση είναι ανεπαρκής.</p>'
        targets:
          target_6_1:
            long_title: "Έως το 2030, επίτευξη καθολικής και ισότιμης πρόσβασης σε ασφαλές και προσιτό πόσιμο νερό για όλους."
            short_title: "Ασφαλές και προσιτό πόσιμο νερό"
          target_6_2:
            long_title: "Έως το 2030, επίτευξη πρόσβασης σε επαρκή και ισότιμη αποχέτευση και υγιεινή για όλους και τερματισμός της αφοδευσης στο ύπαιθρο, δίνοντας ιδιαίτερη προσοχή στις ανάγκες των γυναικών, των κοριτσιών και όσων βρίσκονται σε ευάλωτες καταστάσεις."
            short_title: "Τερματισμός της αφοδευσης στο ύπαιθρο και παροχή πρόσβασης σε αποχέτευση και υγιεινή"
          target_6_3:
            long_title: "Έως το 2030, βελτίωση της ποιότητας του νερού μέσω της μείωσης της ρύπανσης, της εξάλειψης της απόρριψης μπάζων και της ελαχιστοποίησης της απελευθέρωσης επικίνδυνων χημικών ουσιών και υλικών, του υποδιπλασιασμού της αναλογίας των ανεπεξέργαστων λυμάτων και της ουσιαστικής αύξησης της ανακύκλωσης και της ασφαλούς επαναχρησιμοποίησης παγκοσμίως."
            short_title: "Βελτίωση της ποιότητας του νερού, της επεξεργασίας λυμάτων και της ασφαλούς επαναχρησιμοποίησης"
          target_6_4:
            long_title: "Έως το 2030, ουσιαστική αύξηση της αποδοτικότητας χρήσης του νερού σε όλους τους τομείς και διασφάλιση βιώσιμων απολήψεων και παροχής γλυκού νερού για την αντιμετώπιση της λειψυδρίας και την ουσιαστική μείωση του αριθμού των ανθρώπων που υποφέρουν από λειψυδρία."
            short_title: "Αύξηση της αποδοτικότητας χρήσης του νερού και διασφάλιση αποθεμάτων γλυκού νερού"
          target_6_5:
            long_title: "Έως το 2030, εφαρμογή ολοκληρωμένης διαχείρισης των υδατικών πόρων σε όλα τα επίπεδα, μεταξύ άλλων μέσω διασυνοριακής συνεργασίας, ανάλογα με την περίπτωση."
            short_title: "Εφαρμογή ολοκληρωμένης διαχείρισης των υδατικών πόρων"
          target_6_6:
            long_title: "Έως το 2020, προστασία και αποκατάσταση των οικοσυστημάτων που σχετίζονται με το νερό, συμπεριλαμβανομένων των βουνών, των δασών, των υγροτόπων, των ποταμών, των υδροφόρων οριζόντων και των λιμνών."
            short_title: "Προστασία και αποκατάσταση των οικοσυστημάτων που σχετίζονται με το νερό"
          target_6_A:
            long_title: "Έως το 2030, διεύρυνση της διεθνούς συνεργασίας και της υποστήριξης για την ανάπτυξη ικανοτήτων προς τις αναπτυσσόμενες χώρες σε δραστηριότητες και προγράμματα που σχετίζονται με το νερό και την αποχέτευση, συμπεριλαμβανομένων της συλλογής νερού, της αφαλάτωσης, της αποδοτικότητας του νερού, της επεξεργασίας λυμάτων, των τεχνολογιών ανακύκλωσης και επαναχρησιμοποίησης."
            short_title: "Διεύρυνση της υποστήριξης για το νερό και την αποχέτευση στις αναπτυσσόμενες χώρες"
          target_6_B:
            long_title: "Υποστήριξη και ενίσχυση της συμμετοχής των τοπικών κοινοτήτων στη βελτίωση της διαχείρισης του νερού και της αποχέτευσης."
            short_title: "Υποστήριξη της τοπικής εμπλοκής στη διαχείριση του νερού και της αποχέτευσης"
      goal_7:
        title: "Φθηνή και καθαρή ενέργεια"
        title_in_two_lines: "Φθηνή και\nΚαθαρή Ενέργεια"
        description: "Διασφάλιση της πρόσβασης σε φθηνή, αξιόπιστη, βιώσιμη και σύγχρονη ενέργεια."
        long_description: '<p>Ο κόσμος σημειώνει <a href="https://unstats.un.org/sdgs/report/2019/goal-07/">πρόοδο προς τον Στόχο 7</a>, με ενθαρρυντικά σημάδια ότι η ενέργεια γίνεται πιο βιώσιμη και ευρέως διαθέσιμη. Η πρόσβαση στον ηλεκτρισμό στις φτωχότερες χώρες έχει αρχίσει να επιταχύνεται, η ενεργειακή αποδοτικότητα συνεχίζει να βελτιώνεται και οι ανανεώσιμες πηγές ενέργειας σημειώνουν εντυπωσιακά κέρδη στον τομέα του ηλεκτρισμού.&nbsp;</p> <p>Ωστόσο, απαιτείται πιο εστιασμένη προσοχή για τη βελτίωση της πρόσβασης σε καθαρά και ασφαλή καύσιμα και τεχνολογίες μαγειρέματος για 3 δισεκατομμύρια ανθρώπους, για τη διεύρυνση της χρήσης ανανεώσιμων πηγών ενέργειας πέραν του τομέα του ηλεκτρισμού και για την αύξηση του ηλεκτρισμού στη υποσαχάρια Αφρική.</p> <p>Η <a href="https://trackingsdg7.esmap.org/">Έκθεση Ενεργειακής Προόδου</a> παρέχει ένα παγκόσμιο πίνακα καταγραφής για την καταχώριση της προόδου όσον αφορά την πρόσβαση στην ενέργεια, την ενεργειακή αποδοτικότητα και τις ανανεώσιμες πηγές ενέργειας. Αξιολογεί την πρόοδο που σημειώνει κάθε χώρα σε αυτούς τους τρεις πυλώνες και παρέχει μια εικόνα του πόσο απέχουμε από την επίτευξη των στόχων των Στόχων Βιώσιμης Ανάπτυξης για το 2030.</p>'
        targets:
          target_7_1:
            long_title: "Έως το 2030, διασφάλιση της καθολικής πρόσβασης σε προσιτές, αξιόπιστες και σύγχρονες υπηρεσίες ενέργειας."
            short_title: "Καθολική πρόσβαση σε σύγχρονη ενέργεια"
          target_7_2:
            long_title: "Έως το 2030, ουσιαστική αύξηση του μεριδίου των ανανεώσιμων πηγών ενέργειας στο παγκόσμιο ενεργειακό μίγμα."
            short_title: "Αύξηση του παγκόσμιου ποσοστού ανανεώσιμων πηγών ενέργειας"
          target_7_3:
            long_title: "Έως το 2030, διπλασιασμός του παγκόσμιου ρυθμού βελτίωσης της ενεργειακής αποδοτικότητας."
            short_title: "Διπλασιασμός της βελτίωσης στην ενεργειακή αποδοτικότητα"
          target_7_A:
            long_title: "Έως το 2030, ενίσχυση της διεθνούς συνεργασίας για τη διευκόλυνση της πρόσβασης στην έρευνα και την τεχνολογία καθαρής ενέργειας, συμπεριλαμβανομένων των ανανεώσιμων πηγών ενέργειας, της ενεργειακής αποδοτικότητας και της προηγμένης και καθαρότερης τεχνολογίας ορυκτών καυσίμων, και προώθηση των επενδύσεων σε ενεργειακές υποδομές και τεχνολογία καθαρής ενέργειας."
            short_title: "Προώθηση της πρόσβασης στην έρευνα, την τεχνολογία και τις επενδύσεις σε καθαρή ενέργεια"
          target_7_B:
            long_title: "Έως το 2030, επέκταση των υποδομών και αναβάθμιση της τεχνολογίας για την παροχή σύγχρονων και βιώσιμων υπηρεσιών ενέργειας για όλους στις αναπτυσσόμενες χώρες, ιδίως στις λιγότερο αναπτυγμένες χώρες, στα μικρά νησιωτικά αναπτυσσόμενα Κράτη και στις περίκλειστες αναπτυσσόμενες χώρες, σύμφωνα με τα αντίστοιχα προγράμματα υποστήριξής τους."
            short_title: "Επέκταση και αναβάθμιση των ενεργειακών υπηρεσιών για τις αναπτυσσόμενες χώρες"
      goal_8:
        title: "Αξιοπρεπής εργασία και οικονομική ανάπτυξη"
        title_in_two_lines: "Αξιοπρεπής Εργασία και\nΟικονομική Ανάπτυξη"
        description: "Προώθηση της συμπεριληπτικής και βιώσιμης οικονομικής ανάπτυξης, της απασχόλησης και της αξιοπρεπούς εργασίας για όλους."
        long_description: '<p>Η διατηρήσιμη και συμπεριληπτική οικονομική ανάπτυξη μπορεί να οδηγήσει την πρόοδο, να δημιουργήσει αξιοπρεπείς θέσεις εργασίας για όλους και να βελτιώσει το βιοτικό επίπεδο.&nbsp;</p> <p>Ο COVID-19 έχει <a href="https://www.un.org/sites/un2.un.org/files/sg_report_socio-economic_impact_of_covid19.pdf">διαταράξει δισεκατομμύρια ζωές</a> και έχει θέσει σε κίνδυνο την παγκόσμια οικονομία. Το Διεθνές Νομισματικό Ταμείο (ΔΝΤ) αναμένει μια <a href="https://blogs.imf.org/2020/04/14/the-great-lockdown-worst-economic-downturn-since-the-great-depression/">παγκόσμια ύφεση</a> τόσο κακή ή χειρότερη από αυτή του 2009. Καθώς οι απώλειες θέσεων εργασίας κλιμακώνονται, η Διεθνής Οργάνωση Εργασίας εκτιμά ότι <a href="https://www.ilo.org/global/about-the-ilo/newsroom/news/WCMS_743036/lang--en/index.htm">σχεδόν το ήμισυ του παγκόσμιου εργατικού δυναμικού κινδυνεύει</a> να χάσει τα μέση διαβίωσής του.</p> <p><a href="https://developmentfinance.un.org/press-release-financing-sustainable-development-report-2020">Ακόμη και πριν από το ξέσπασμα του COVID-19</a>, μία στις πέντε χώρες – που φιλοξενούν δισεκατομμύρια ανθρώπους που ζουν σε συνθήκες φτώχειας – ήταν πιθανό να δουν τα κατά κεφαλήν εισοδήματα να λιμνάζουν ή να μειώνονται το 2020. Τώρα, οι<a href="https://developmentfinance.un.org/press-release-financing-sustainable-development-report-2020"> οικονομικές και χρηματοπιστωτικές κρίσεις</a> που σχετίζονται με τον COVID-19—όπως οι διαταραχές στη βιομηχανική παραγωγή, η πτώση των τιμών των εμπορευμάτων, η μεταβλητότητα των χρηματοπιστωτικών αγορών και η αυξανόμενη αβεβαιότητα—εκτροχιάζουν την ήδη υποτονική οικονομική ανάπτυξη και επιδεινώνουν τους αυξημένους κινδύνους από άλλους παράγοντες.&nbsp;&nbsp;</p>'
        targets:
          target_8_1:
            long_title: "Διατήρηση της κατά κεφαλήν οικονομικής ανάπτυξης σύμφωνα με τις εθνικές συνθήκες και, ιδίως, αύξηση του ακαθάριστου εγχώριου προϊόντος τουλάχιστον κατά 7 τοις εκατό ετησίως στις λιγότερο αναπτυγμένες χώρες."
            short_title: "Βιώσιμη οικονομική ανάπτυξη"
          target_8_2:
            long_title: "Επίτευξη υψηλότερων επιπέδων οικονομικής παραγωγικότητας μέσω της διαφοροποίησης, της τεχνολογικής αναβάθμισης και της καινοτομίας, μεταξύ άλλων μέσω της εστίασης σε τομείς υψηλής προστιθέμενης αξίας και εντάσεως εργασίας."
            short_title: "Διαφοροποίηση, καινοτομία και αναβάθμιση για οικονομική παραγωγικότητα"
          target_8_3:
            long_title: "Προώθηση πολιτικών προσανατολισμένων στην ανάπτυξη που υποστηρίζουν τις παραγωγικές δραστηριότητες, τη δημιουργία αξιοπρεπών θέσεων εργασίας, την επιχειρηματικότητα, τη δημιουργικότητα και την καινοτομία, και ενθάρρυνση της επισημοποίησης και της ανάπτυξης των πολύ μικρών, μικρών και μεσαίων επιχειρήσεων, μεταξύ άλλων μέσω της πρόσβασης σε χρηματοπιστωτικές υπηρεσίες."
            short_title: "Προώθηση πολιτικών για την υποστήριξη της δημιουργίας θέσεων εργασίας και των αναπτυσσόμενων επιχειρήσεων"
          target_8_4:
            long_title: "Βελτίωση σταδιακά, έως το 2030, της παγκόσμιας αποδοτικότητας των πόρων στην κατανάλωση και την παραγωγή και προσπάθεια αποσύνδεσης της οικονομικής ανάπτυξης από την περιβαλλοντική υποβάθμιση, σύμφωνα με το 10ετές πλαίσιο προγραμμάτων για τη βιώσιμη κατανάλωση και παραγωγή, με τις αναπτυγμένες χώρες να αναλαμβάνουν την ηγεσία."
            short_title: "Βελτίωση της αποδοτικότητας των πόρων στην κατανάλωση και την παραγωγή"
          target_8_5:
            long_title: "Έως το 2030, επίτευξη πλήρους και παραγωγικής απασχόλησης και αξιοπρεπούς εργασίας για όλες τις γυναίκες και τους άνδρες, συμπεριλαμβανομένων των νέων και των ατόμων με αναπηρία, και ίση αμοιβή για εργασία ίσης αξίας."
            short_title: "Πλήρης απασχόληση και αξιοπρεπής εργασία με ίση αμοιβή"
          target_8_6:
            long_title: "Έως το 2020, ουσιαστική μείωση του ποσοστού των νέων που βρίσκονται εκτός απασχόλησης, εκπαίδευσης ή κατάρτισης."
            short_title: "Προώθηση της απασχόλησης, της εκπαίδευσης και της κατάρτισης των νέων"
          target_8_7:
            long_title: "Λήψη άμεσων και αποτελεσματικών μέτρων για την εξάλειψη της καταναγκαστικής εργασίας, τον τερματισμό της σύγχρονης δουλείας και της εμπορίας ανθρώπων και τη διασφάλιση της απαγόρευσης και εξάλειψης των χειρότερων μορφών παιδικής εργασίας, συμπεριλαμβανομένης της στρατολόγησης και χρήσης παιδιών-στρατιωτών, και έως το 2025 τερματισμός της παιδικής εργασίας σε όλες τις μορφές της."
            short_title: "Τερματισμός της σύγχρονης δουλείας, της εμπορίας ανθρώπων και της παιδικής εργασίας"
          target_8_8:
            long_title: "Προστασία των εργασιακών δικαιωμάτων και προώθηση ασφαλών εργασιακών περιβαλλόντων για όλους τους εργαζόμενους, συμπεριλαμβανομένων των διακινούμενων εργαζομένων, ιδίως των γυναικών μεταναστών, και όσων βρίσκονται σε αβέβαιη απασχόληση."
            short_title: "Προστασία των εργασιακών δικαιωμάτων και προώθηση ασφαλών εργασιακών περιβαλλόντων"
          target_8_9:
            long_title: "Έως το 2030, σχεδιασμός και εφαρμογή πολιτικών για την προώθηση του βιώσιμου τουρισμού που δημιουργεί θέσεις εργασίας και προωθεί τον τοπικό πολιτισμό και τα προϊόντα"
            short_title: "Προώθηση του ωφέλιμου και βιώσιμου τουρισμού"
          target_8_10:
            long_title: "Ενίσχυση της ικανότητας των εγχώριων χρηματοπιστωτικών ιδρυμάτων για την ενθάρρυνση και τη διεύρυνση της πρόσβασης σε τραπεζικές, ασφαλιστικές και χρηματοπιστωτικές υπηρεσίες για όλους."
            short_title: "Καθολική πρόσβαση σε τραπεζικές, ασφαλιστικές και χρηματοπιστωτικές υπηρεσίες"
          target_8_A:
            long_title: "Αύξηση της υποστήριξης \"Βοήθεια για το Εμπόριο\" (Aid for Trade) προς τις αναπτυσσόμενες χώρες, ιδίως τις λιγότερο αναπτυγμένες χώρες, μεταξύ άλλων μέσω του Ενισχυμένου Ολοκληρωμένου Πλαισίου για Τεχνική Βοήθεια Σχετική με το Εμπόριο προς τις Λιγότερο Αναπτυγμένες Χώρες."
            short_title: "Αύξηση της υποστήριξης \"Βοήθεια για το Εμπόριο\""
          target_8_B:
            long_title: "Έως το 2020, ανάπτυξη και θέση σε λειτουργία μιας παγκόσμιας στρατηγικής για την απασχόληση των νέων και εφαρμογή του Παγκόσμιου Συμφώνου για τις Θέσεις Εργασίας της Διεθνούς Οργάνωσης Εργασίας."
            short_title: "Ανάπτυξη παγκόσμιας στρατηγικής για την απασχόληση των νέων"
      goal_9:
        title: "Βιομηχανία, καινοτομία και υποδομές"
        title_in_two_lines: "Βιομηχανία, Καινοτομία\nκαι Υποδομές"
        description: "Δημιουργία ανθεκτικών υποδομών, προώθηση της βιώσιμης βιομηχανίας και ενίσχυση της καινοτομίας."
        long_description: '<p>Η συμπεριληπτική και βιώσιμη βιομηχανοποίηση, μαζί με την <a href="https://unstats.un.org/sdgs/report/2019/goal-09/">καινοτομία και τις υποδομές</a>, μπορεί να απελευθερώσει δυναμικές και ανταγωνιστικές οικονομικές δυνάμεις που δημιουργούν απασχόληση και εισόδημα. Διαδραματίζουν βασικό ρόλο στην εισαγωγή και προώθηση νέων τεχνολογιών, στη διευκόλυνση του διεθνούς εμπορίου και στην αποδοτική χρήση των πόρων.&nbsp;</p> <p>Ωστόσο, ο κόσμος έχει ακόμη δρόμο να διανύσει για να αξιοποιήσει πλήρως αυτές τις δυνατότητες. Οι λιγότερο αναπτυγμένες χώρες, ειδικότερα, πρέπει να επιταχύνουν την ανάπτυξη του μεταποιητικού τους τομέα εάν θέλουν να επιτύχουν τον στόχο του 2030, και να αυξήσουν τις επενδύσεις στην επιστημονική έρευνα και την καινοτομία.&nbsp;</p> <p>Η παγκόσμια αύξηση της μεταποίησης μειωνόταν σταθερά, ακόμη και πριν από το ξέσπασμα της πανδημίας COVID-19. Η πανδημία <a href="https://unctad.org/en/pages/newsdetails.aspx?OriginalVersionID=2297">πλήττει σκληρά τις μεταποιητικές βιομηχανίες</a> και προκαλεί διαταραχές στις παγκόσμιες αλυσίδες αξίας και στην προμήθεια προϊόντων.&nbsp;</p> <p>Η καινοτομία και η τεχνολογική πρόοδος αποτελούν κλειδί για τη βρείτε βιώσιμες λύσεις τόσο σε οικονομικές όσο και σε περιβαλλοντικές προκλήσεις, όπως η αυξημένη αποδοτικότητα πόρων και ενέργειας. Παγκοσμίως, <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">οι επενδύσεις στην έρευνα και την ανάπτυξη</a> (R&amp;D) ως ποσοστό του ΑΕΠ αυξήθηκαν από 1,5% το 2000 σε 1,7% το 2015 και παρέμειναν σχεδόν αμετάβλητες το 2017, αλλά ήταν λιγότερο από 1% στις αναπτυσσόμενες περιοχές.</p> <p>Όσον αφορά τις υποδομές επικοινωνιών, περισσότερο από το μισό του παγκόσμιου πληθυσμού είναι πλέον συνδεδεμένο στο διαδίκτυο και σχεδόν ολόκληρος ο παγκόσμιος πληθυσμός ζει σε περιοχή που καλύπτεται από δίκτυο κινητής τηλεφωνίας. Εκτιμάται ότι το 2019, <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">το 96,5% καλύπτονταν τουλάχιστον από δίκτυο 2G</a>.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p> <p>Η πανδημία του κορωνοϊού αποκάλυψε την επείγουσα <a href="https://www.unescap.org/blog/covid-19-reveals-urgent-need-resilient-infrastructure">ανάγκη για ανθεκτικές υποδομές</a>. Η Ασιατική Τράπεζα Ανάπτυξης σημειώνει ότι οι κρίσιμες υποδομές στην περιοχή παραμένουν μακράν από επαρκείς σε πολλές χώρες, παρά ταχεία οικονομική ανάπτυξη που γνώρισε η περιοχή την τελευταία δεκαετία. Η <a href="https://www.unescap.org/publications/economic-and-social-survey-asia-and-pacific-2019-ambitions-beyond-growth">Οικονομική και Κοινωνική Επισκόπηση Ασίας και Ειρηνικού</a> υπογραμμίζει ότι η καθιστώντας τις υποδομές ανθεκτικές σε καταστροφές και στην κλιματική αλλαγή θα απαιτήσει πρόσθετη επένδυση 434 δισεκατομμυρίων δολαρίων ετησίως. Το ποσό αυτό ενδέχεται να χρειαστεί να είναι ακόμη μεγαλύτερο σε ορισμένες υποπεριοχές, όπως τα μικρά νησιωτικά αναπτυσσόμενα κράτη του Ειρηνικού.&nbsp; &nbsp; &nbsp; </p>'
        targets:
          target_9_1:
            long_title: "Ανάπτυξη ποιοτικών, αξιόπιστων, βιώσιμων και ανθεκτικών υποδομών, συμπεριλαμβανομένων των περιφερειακών και διασυνοριακών υποδομών, για την υποστήριξη της οικονομικής ανάπτυξης και της ανθρώπινης ευημερίας, με επίκεντρο την προσιτή και ισότιμη πρόσβαση για όλους."
            short_title: "Ανάπτυξη βιώσιμων, ανθεκτικών και συμπεριληπτικών υποδομών"
          target_9_2:
            long_title: "Προώθηση της συμπεριληπτικής και βιώσιμης βιομηχανοποίησης και, έως το 2030, σημαντική αύξηση του μεριδίου της βιομηχανίας στην απασχόληση και το ακαθάριστο εγχώριο προϊόν, σύμφωνα με τις εθνικές συνθήκες, και διπλασιασμός του μεριδίου της στις λιγότερο αναπτυγμένες χώρες."
            short_title: "Προώθηση της συμπεριληπτικής και βιώσιμης βιομηχανοποίησης"
          target_9_3:
            long_title: "Αύξηση της πρόσβασης των μικρής κλίμακας βιομηχανικών και άλλων επιχειρήσεων, ιδίως στις αναπτυσσόμενες χώρες, σε χρηματοπιστωτικές υπηρεσίες, συμπεριλαμβανομένων των προσιτών πιστώσεων, και η ενσωμάτωσή τους σε αλυσίδες αξίας και αγορές."
            short_title: "Αύξηση της πρόσβασης σε χρηματοπιστωτικές υπηρεσίες και αγορές"
          target_9_4:
            long_title: "Έως το 2030, αναβάθμιση των υποδομών και εκσυγχρονισμός των βιομηχανιών ώστε να καταστούν βιώσιμες, με αυξημένη αποδοτικότητα χρήσης των πόρων και μεγαλύτερη υιοθέτηση καθαρών και περιβαλλοντικά ορθών τεχνολογιών και βιομηχανικών διεργασιών, με όλες τις χώρες να αναλαμβάνουν δράση σύμφωνα με τις αντίστοιχες δυνατότητές τους."
            short_title: "Αναβάθμιση όλων των βιομηχανιών και υποδομών για τη βιωσιμότητα"
          target_9_5:
            long_title: "Ενίσχυση της επιστημονικής έρευνας, αναβάθμιση των τεχνολογικών δυνατοτήτων των βιομηχανικών τομέων σε όλες τις χώρες, ιδίως στις αναπτυσσόμενες χώρες, συμπεριλαμβανομένης, έως το 2030, της ενθάρρυνσης της καινοτομίας και της ουσιαστικής αύξησης του αριθμού των εργαζομένων στην έρευνα και την ανάπτυξη ανά 1 εκατομμύριο ανθρώπους και των δημόσιων και ιδιωτικών δαπανών για την έρευνα και την ανάπτυξη."
            short_title: "Ενίσχυση της έρευνας και αναβάθμιση των βιομηχανικών τεχνολογιών"
          target_9_A:
            long_title: "Διευκόλυνση της ανάπτυξης βιώσιμων και ανθεκτικών υποδομών στις αναπτυσσόμενες χώρες μέσω ενισχυμένης χρηματοδοτικής, τεχνολογικής και τεχνικής υποστήριξης προς τις αφρικανικές χώρες, τις λιγότερο αναπτυγμένες χώρες, τις περίκλειστες αναπτυσσόμενες χώρες και τα μικρά νησιωτικά αναπτυσσόμενα Κράτη 18."
            short_title: "Διευκόλυνση της ανάπτυξης βιώσιμων υποδομών για τις αναπτυσσόμενες χώρες"
          target_9_B:
            long_title: "Υποστήριξη της εγχώριας τεχνολογικής ανάπτυξης, έρευνας και καινοτομίας στις αναπτυσσόμενες χώρες, μεταξύ άλλων μέσω της διασφάλισης ενός ευνοϊκού περιβάλλοντος πολιτικής, μεταξύ άλλων, για τη βιομηχανική διαφοροποίηση και την προστιθέμενη αξία στα εμπορεύματα."
            short_title: "Υποστήριξη της εγχώριας τεχνολογικής ανάπτυξης και βιομηχανικής διαφοροποίησης"
          target_9_C:
            long_title: "Σημαντική αύξηση της πρόσβασης στην τεχνολογία πληροφοριών και επικοινωνιών και προσπάθεια για την παροχή καθολικής και προσιτής πρόσβασης στο Διαδίκτυο στις λιγότερο αναπτυγμένες χώρες έως το 2020."
            short_title: "Καθολική πρόσβαση στην τεχνολογία πληροφοριών και επικοινωνιών"
      goal_10:
        title: "Λιγότερες ανισότητες"
        title_in_two_lines: "Λιγότερες\nΑνισότητες"
        description: "Μείωση της ανισότητας εντός και μεταξύ των χωρών."
        long_description: '<p>Η μείωση των ανισοτήτων και η διασφάλιση ότι κανείς δεν μένει πίσω είναι θεμελιώδους σημασίας για την επίτευξη των Στόχων Βιώσιμης Ανάπτυξης.&nbsp;</p> <p>Η ανισότητα εντός και μεταξύ των χωρών αποτελεί επίμονη αιτία ανησυχίας. Παρά ορισμένα θετικά σημάδια προς τη μείωση της ανισότητας σε ορισμένες διαστάσεις, όπως η μείωση της σχετικής εισοδηματικής ανισότητας σε ορισμένες χώρες και το προτιμησιακό εμπορικό καθεστώς που ωφελεί τις χώρες με χαμηλότερο εισόδημα, <a href="https://unstats.un.org/sdgs/report/2019/goal-10/">η ανισότητα εξακολουθεί να υφίσταται</a>.</p> <p><a href="https://www.un.org/sustainabledevelopment/goal-of-the-month-may-2020">Ο COVID-19 έχει βαθύνει τις υπάρχουσες ανισότητες</a>, πλήττοντας σκληρότερα τις φτωχότερες και πιο ευάλωτες κοινότητες. Έχει αναδείξει τις οικονομικές ανισότητες και τα εύθραυστα δίχτυα κοινωνικής προστασίας που αφήνουν τις ευάλωτες κοινότητες να επωμίζονται το κύριο βάρος της κρίσης.&nbsp; Παράλληλα, οι κοινωνικές, πολιτικές και οικονομικές ανισότητες έχουν ενισχύσει τις επιπτώσεις της πανδημίας.</p> <p>Στο οικονομικό μέτωπο, η πανδημία COVID-19 έχει αυξήσει σημαντικά την παγκόσμια <a href="https://www.ilo.org/global/about-the-ilo/newsroom/news/WCMS_743036/lang--en/index.htm">ανεργία</a> και έχει μειώσει δραματικά τα εισοδήματα των εργαζομένων.</p> <p>Ο COVID-19 θέτει επίσης σε κίνδυνο την περιορισμένη πρόοδο που έχει σημειωθεί όσον αφορά την <a href="https://data.unwomen.org/resources/covid-19-emerging-gender-data-and-why-it-matters">ισότητα των φύλων</a> και τα δικαιώματα των γυναικών τις τελευταίες δεκαετίες. Σε κάθε σφαίρα, από την υγεία έως την οικονομία, την ασφάλεια έως την κοινωνική προστασία, οι επιπτώσεις του COVID-19 επιδεινώνονται για τις γυναίκες και τα κορίτσια απλά και μόνο λόγω του φύλου τους.</p> <p>Οι ανισότητες βαθαίνουν επίσης για τους <a href="https://www.un.org/sites/un2.un.org/files/un_policy_brief_on_human_rights_and_covid_23_april_2020.pdf">ευάλωτους πληθυσμούς</a> σε χώρες με ασθενέστερα συστήματα υγείας και σε εκείνες που αντιμετωπίζουν υπάρχουσες ανθρωπιστικές κρίσεις. Οι πρόσφυγες και οι μετανάστες, καθώς και οι αυτόχθονες πληθυσμοί, οι ηλικιωμένοι, τα άτομα με αναπηρία και τα παιδιά κινδυνεύουν ιδιαίτερα να μείνουν πίσω. Και η <a href="https://www.un.org/en/coronavirus/covid-19-un-counters-pandemic-related-hate-and-xenophobia">ρητορική μίσους</a> που στοχεύει ευάλωτες ομάδες αυξάνεται.</p>'
        targets:
          target_10_1:
            long_title: "Έως το 2030, σταδιακή επίτευξη και διατήρηση της αύξησης του εισοδήματος του χαμηλότερου 40 τοις εκατό του πληθυσμού με ρυθμό υψηλότερο από τον εθνικό μέσο όρο."
            short_title: "Μείωση των εισοδηματικών ανισοτήτων"
          target_10_2:
            long_title: "Έως το 2030, ενδυνάμωση και προώθηση της κοινωνικής, οικονομικής και πολιτικής ένταξης όλων, ανεξαρτήτως ηλικίας, φύλου, αναπηρίας, φυλής, εθνότητας, καταγωγής, θρησκείας ή οικονομικού ή άλλου καθεστώτος."
            short_title: "Προώθηση καθολικής κοινωνικής, οικονομικής και πολιτικής ένταξης"
          target_10_3:
            long_title: "Διασφάλιση ίσων ευκαιριών και μείωση των ανισοτήτων στα αποτελέσματα, μεταξύ άλλων μέσω της εξάλειψης νόμων, πολιτικών και πρακτικών που εισάγουν διακρίσεις και της προώθησης κατάλληλης νομοθεσίας, πολιτικών και δράσεων σχετικά με αυτό."
            short_title: "Διασφάλιση ίσων ευκαιριών και τερματισμός των διακρίσεων"
          target_10_4:
            long_title: "Υιοθέτηση πολιτικών, ιδίως δημοσιονομικών, μισθολογικών πολιτικών και πολιτικών κοινωνικής προστασίας, και σταδιακή επίτευξη μεγαλύτερης ισότητας."
            short_title: "Υιοθέτηση δημοσιονομικών και κοινωνικών πολιτικών που προωθούν την ισότητα"
          target_10_5:
            long_title: "Βελτίωση της ρύθμισης και παρακολούθησης των παγκόσμιων χρηματοπιστωτικών αγορών και ιδρυμάτων και ενίσχυση της εφαρμογής τέτοιων ρυθμίσεων."
            short_title: "Βελτιωμένη ρύθμιση των παγκόσμιων χρηματοπιστωτικών αγορών και ιδρυμάτων"
          target_10_6:
            long_title: "Διασφάλιση ενισχυμένης εκπροσώπησης και φωνής για τις αναπτυσσόμενες χώρες στη λήψη αποφάσεων σε παγκόσμια διεθνή οικονομικά και χρηματοπιστωτικά ιδρύματα, προκειμένου να δημιουργηθούν πιο αποτελεσματικά, αξιόπιστα, υπόλογα και νόμιμα ιδρύματα."
            short_title: "Ενισχυμένη εκπροσώπηση για τις αναπτυσσόμενες χώρες σε χρηματοπιστωτικά ιδρύματα"
          target_10_7:
            long_title: "Διευκόλυνση της εύρυθμης, ασφαλούς, τακτικής και υπεύθυνης μετάβασης και κινητικότητας των ανθρώπων, μεταξύ άλλων μέσω της εφαρμογής σχεδιασμένων και εcomplete διαχειριζόμενων μεταναστευτικών πολιτικών."
            short_title: "Υπεύθυνες και καλά διαχειριζόμενες μεταναστευτικές πολιτικές"
          target_10_A:
            long_title: "Εφαρμογή της αρχής της ειδικής και διαφοροποιημένης μεταχείρισης για τις αναπτυσσόμενες χώρες, ιδίως τις λιγότερο αναπτυγμένες χώρες, σύμφωνα με τις συμφωνίες του Παγκόσμιου Οργανισμού Εμπορίου."
            short_title: "Ειδική και διαφοροποιημένη μεταχείριση για τις αναπτυσσόμενες χώρες"
          target_10_B:
            long_title: "Ενθάρρυνση της επίσημης αναπτυξιακής βοήθειας και των χρηματοπιστωτικών ροών, συμπεριλαμβανομένων των ξένων άμεσων επενδύσεων, προς τα Κράτη όπου η ανάγκη είναι μεγαλύτερη, ιδίως τις λιγότερο αναπτυγμένες χώρες, τις αφρικανικές χώρες, τα μικρά νησιωτικά αναπτυσσόμενα Κράτη και τις περίκλειστες αναπτυσσόμενες χώρες, σύμφωνα με τα εθνικά τους σχέδια και προγράμματα."
            short_title: "Ενθάρρυνση αναπτυξιακής βοήθειας και επενδύσεων στις λιγότερο αναπτυγμένες χώρες"
          target_10_C:
            long_title: "Έως το 2030, μείωση σε λιγότερο από 3 τοις εκατό του κόστους συναλλαγών για τα εμβάσματα των μεταναστών και εξάλειψη των διαδρόμων εμβασμάτων με κόστος υψηλότερο από 5 τοις εκατό."
            short_title: "Μείωση του κόστους συναλλαγών για τα εμβάσματα των μεταναστών"
      goal_11:
        title: "Βιώσιμες πόλεις και κοινότητες"
        title_in_two_lines: "Βιώσιμες Πόλεις\nκαι Κοινότητες"
        description: "Δημιουργία πόλεων συμπεριληπτικών, ασφαλών, ανθεκτικών και βιώσιμων."
        long_description: '<p>Ο κόσμος γίνεται όλο και πιο αστικοποιημένος. Από το 2007, <a href="https://unstats.un.org/sdgs/report/2019/goal-11/">περισσότερο από το μισό του παγκόσμιου πληθυσμού ζει σε πόλεις</a>, και το ποσοστό αυτό προβλέπεται να αυξηθεί σε 60 τοις εκατό έως το 2030.&nbsp;</p> <p>Οι πόλεις και οι μητροπολιτικές περιοχές αποτελούν κινητήριες δυνάμεις της οικονομικής ανάπτυξης—συνεισφέροντας περίπου το 60 τοις εκατό του παγκόσμιου ΑΕΠ. Ωστόσο, αντιπροσωπεύουν επίσης περίπου το 70 τοις εκατό των παγκόσμιων εκπομπών άνθρακα και πάνω από το 60 τοις εκατό της χρήσης πόρων.&nbsp;</p> <p>Η ταχεία αστικοποίηση οδηγεί σε αυξανόμενο αριθμό κατοίκων σε παραγκουπόλεις, ανεπαρκείς και επιβαρημένες υποδομές και υπηρεσίες (όπως η συλλογή απορριμμάτων και τα συστήματα ύδρευσης και αποχέτευσης, οι δρόμοι και οι μεταφορές), επιδείνωση της ατμοσφαιρικής ρύπανσης και ανεξέλεγκτη αστική εξάπλωση.&nbsp;</p> <p><a href="https://unhabitat.org/coronavirus-will-travel-incredibly-fast-in-africas-slums-un-habitat-chief-warns">Οι επιπτώσεις του COVID-19</a> θα είναι πιο καταστροφικές σε φτωχές και πυκνοκατοικημένες αστικές περιοχές, ειδικά για το ένα δισεκατομμύριο ανθρώπους που ζουν σε ανεπίσημους οικισμούς και παραγκουπόλεις παγκοσμίως, όπου ο υπερπληθυσμός δυσκολεύει επίσης την τήρηση των συνιστώμενων μέτρων όπως η κοινωνική αποστασιοποίηση και η αυτοαπομόνωση.&nbsp;</p> <p>Η οργάνωση τροφίμων του ΟΗΕ, FAO, προειδοποίησε ότι η πείνα και οι θάνατοι θα μπορούσαν να αυξηθούν σημαντικά σε αστικές περιοχές, χωρίς μέτρα που να διασφαλίζουν ότι οι φτωχοί και ευάλωτοι κάτοικοι έχουν <a href="https://news.un.org/en/story/2020/05/1063622">πρόσβαση σε τρόφιμα</a>.&nbsp;</p>'
        targets:
          target_11_1:
            long_title: "Έως το 2030, διασφάλιση της πρόσβασης όλων σε επαρκή, ασφαλή και προσιτή στέγαση και βασικές υπηρεσίες και αναβάθμιση των παραγκουπόλεων."
            short_title: "Ασφαλής και προσιτή στέγαση"
          target_11_2:
            long_title: "Έως το 2030, παροχή πρόσβασης σε ασφαλή, προσιτά, προσβάσιμα και βιώσιμα συστήματα μεταφορών για όλους, βελτιώνοντας την οδική ασφάλεια, ιδίως μέσω της επέκτασης των δημόσιων συγκοινωνιών, με ιδιαίτερη προσοχή στις ανάγκες όσων βρίσκονται σε ευάλωτες καταστάσεις, των γυναικών, των παιδιών, των ατόμων με αναπηρία και των ηλικιωμένων."
            short_title: "Προσιτά και βιώσιμα συστήματα μεταφορών"
          target_11_3:
            long_title: "Έως το 2030, ενίσχυση της συμπεριληπτικής και βιώσιμης αστικοποίησης και της ικανότητας για συμμετοχικό, ολοκληρωμένο και βιώσιμο σχεδιασμό και διαχείριση των ανθρώπινων οικισμών σε όλες τις χώρες."
            short_title: "Συμπεριληπτική και βιώσιμη αστικοποίηση"
          target_11_4:
            long_title: "Ενίσχυση των προσπαθειών για την προστασία και τη διαφύλαξη της παγκόσμιας πολιτιστικής και φυσικής κληρονομιάς."
            short_title: "Προστασία της παγκόσμιας πολιτιστικής και φυσικής κληρονομιάς"
          target_11_5:
            long_title: "Έως το 2030, σημαντική μείωση του αριθμού των θανάτων και του αριθμού των ανθρώπων που επηρεάζονται και ουσιαστική μείωση των άμεσων οικονομικών ζημιών σε σχέση με το παγκόσμιο ακαθάριστο εγχώριο προϊόν που προκαλούνται από καταστροφές, συμπεριλαμβανομένων των καταστροφών που σχετίζονται με το νερό, με επίκεντρο την προστασία των φτωχών και των ανθρώπων σε ευάλωτες καταστάσεις."
            short_title: "Μείωση των αρνητικών επιπτώσεων των φυσικών καταστροφών"
          target_11_6:
            long_title: "Έως το 2030, μείωση του αρνητικού κατά κεφαλήν περιβαλλοντικού αντικτύπου των πόλεων, μεταξύ άλλων δίνοντας ιδιαίτερη προσοχή στην ποιότητα του αέρα και στη διαχείριση των δημοτικών και άλλων αποβλήτων."
            short_title: "Μείωση του περιβαλλοντικού αντικτύπου των πόλεων"
          target_11_7:
            long_title: "Έως το 2030, παροχή καθολικής πρόσβασης σε ασφαλείς, συμπεριληπτικούς και προσβάσιμους, πράσινους και δημόσιους χώρους, ιδίως για τις γυναίκες και τα παιδιά, τους ηλικιωμένους και τα άτομα με αναπηρία."
            short_title: "Παροχή πρόσβασης σε ασφαλείς και συμπεριληπτικούς πράσινους και δημόσιους χώρους"
          target_11_A:
            long_title: "Υποστήριξη θετικών οικονομικών, κοινωνικών και περιβαλλοντικών συνδέσεων μεταξύ αστικών, περιαστικών και αγροτικών περιοχών μέσω της ενίσχυσης του εθνικού και περιφερειακού αναπτυξιακού σχεδιασμού."
            short_title: "Ισχυρός εθνικός και περιφερειακός αναπτυξιακός σχεδιασμός"
          target_11_B:
            long_title: "Έως το 2020, ουσιαστική αύξηση του αριθμού των πόλεων και των ανθρώπινων οικισμών που υιοθετούν και εφαρμόζουν ολοκληρωμένες πολιτικές και σχέδια προς την κατεύθυνση της ένταξης, της αποδοτικότητας των πόρων, της μείωσης και προσαρμογής στην κλιματική αλλαγή, της ανθεκτικότητας σε καταστροφές, και ανάπτυξη και εφαρμογή, σύμφωνα με το Πλαίσιο Σεντάι για τη Μείωση του Κινδύνου Καταστροφών 2015-2030, ολιστικής διαχείρισης κινδύνου καταστροφών σε όλα τα επίπεδα."
            short_title: "Εφαρμογή πολιτικών για την ένταξη, την αποδοτικότητα των πόρων και τη μείωση του κινδύνου καταστροφών"
          target_11_C:
            long_title: "Υποστήριξη των λιγότερο αναπτυγμένων χωρών, μεταξύ άλλων μέσω χρηματοδοτικής και τεχνικής βοήθειας, για τη δημιουργία βιώσιμων και ανθεκτικών κτιρίων με τη χρήση τοπικών υλικών."
            short_title: "Υποστήριξη των λιγότερο αναπτυγμένων χωρών στη βιώσιμη και ανθεκτική δόμηση"
      goal_12:
        title: "Υπεύθυνη κατανάλωση και παραγωγή"
        title_in_two_lines: "Υπεύθυνη Κατανάλωση\nκαι Παραγωγή"
        description: "Διασφάλιση βιώσιμων προτύπων κατανάλωσης και παραγωγής."
        long_description: '<p>Η παγκόσμια κατανάλωση και παραγωγή — κινητήριος δύναμη της παγκόσμιας οικονομίας — βασίζονται στη χρήση του φυσικού περιβάλλοντος και των πόρων με τρόπο που συνεχίζει να έχει καταστροφικές επιπτώσεις στον πλανήτη.&nbsp;</p> <p>Η οικονομική και κοινωνική πρόοδος κατά τον τελευταίο αιώνα συνοδεύτηκε από περιβαλλοντική υποβάθμιση που θέτει σε κίνδυνο τα ίδια τα συστήματα από τα οποία εξαρτάται η μελλοντική μας ανάπτυξη — πράγματι, η ίδια η επιβίωσή μας.&nbsp;</p> <p>Ορισμένα <a href="https://www.unenvironment.org/explore-topics/sustainable-development-goals/why-do-sustainable-development-goals-matter/goal-12">γεγονότα και αριθμοί</a>:</p> <ul> <li style="font-weight: 400">Κάθε χρόνο, υπολογίζεται ότι το ένα τρίτο του συνόλου των παραγόμενων τροφίμων – που ισοδυναμεί με 1,3 δισεκατομμύρια τόνους αξίας περίπου 1 τρισεκατομμυρίου δολαρίων – καταλήγει να σαπίζει στους κάδους των καταναλωτών και των λιανοπωλητών, ή να αλλοιώνεται λόγω κακών πρακτικών μεταφοράς και συγκομιδής.</li> <li style="font-weight: 400">Εάν οι άνθρωποι παγκοσμίως μεταβούν σε ενεργειακά αποδοτικούς λαμπτήρες, ο κόσμος θα εξοικονομούσε 120 δισεκατομμύρια δολάρια ΗΠΑ ετησίως.</li> <li style="font-weight: 400">Εάν ο παγκόσμιος πληθυσμός φτάσει τα 9,6 δισεκατομμύρια έως το 2050, θα μπορούσε να απαιτηθεί το ισοδύναμο σχεδόν τριών πλανητών για την παροχή των φυσικών πόρων που απαιτούνται για τη διατήρηση του σημερινού τρόπου ζωής.</li> </ul> <p>Η πανδημία COVID-19 προσφέρει στις χώρες την ευκαιρία να δημιουργήσουν σχέδια ανάκαμψης που θα ανατρέψουν τις τρέχουσες τάσεις και θα αλλάξουν τα πρότυπα κατανάλωσης και παραγωγής προς ένα πιο βιώσιμο μέλλον.</p> <p><a href="https://www.unenvironment.org/explore-topics/resource-efficiency/what-we-do/sustainable-consumption-and-production-policies">Η βιώσιμη κατανάλωση και παραγωγή</a> αφορούν τη επίτευξη περισσότερων και καλύτερων αποτελεσμάτων με λιγότερα μέσα. Αφορούν επίσης την αποσύνδεση της οικονομικής ανάπτυξης από την περιβαλλοντική υποβάθμιση, την αύξηση της αποδοτικότητας των πόρων και την προώθηση βιώσιμων τρόπων ζωής.</p> <p>Η βιώσιμη κατανάλωση και παραγωγή μπορούν επίσης να συμβάλουν ουσιαστικά στην ελάφρυνση της φτώχειας και στη μετάβαση προς οικονομίες χαμηλών εκπομπών άνθρακα και πράσινες οικονομίες.</p>'
        targets:
          target_12_1:
            long_title: "Εφαρμογή του 10ετούς πλαισίου προγραμμάτων για τη βιώσιμη κατανάλωση και παραγωγή, με ανάληψη δράσης από όλες τις χώρες και με τις αναπτυγμένες χώρες να αναλαμβάνουν την ηγεσία, λαμβάνοντας υπόψη την ανάπτυξη και τις δυνατότητες των αναπτυσσόμενων χωρών."
            short_title: "Εφαρμογή του 10ετούς Πλαισίου για τη Βιώσιμη Κατανάλωση και Παραγωγή"
          target_12_2:
            long_title: "Έως το 2030, επίτευξη της βιώσιμης διαχείρισης και της αποδοτικής χρήσης των φυσικών πόρων."
            short_title: "Βιώσιμη Διαχείριση και Χρήση των Φυσικών Πόρων"
          target_12_3:
            long_title: "Έως το 2030, υποδιπλασιασμός της κατά κεφαλήν παγκόσμιας σπατάλης τροφίμων σε επίπεδο λιανικής πώλησης και καταναλωτή και μείωση των απωλειών τροφίμων κατά μήκος των αλυσίδων παραγωγής και εφοδιασμού, συμπεριλαμβανομένων των απωλειών μετά τη συγκομιδή."
            short_title: "Υποδιπλασιασμός της Παγκόσμιας Κατά Κεφαλήν Σπατάλης Τροφίμων"
          target_12_4:
            long_title: "Έως το 2020, επίτευξη της περιβαλλοντικά ορθής διαχείρισης των χημικών ουσιών και όλων των αποβλήτων καθ' όλη τη διάρκεια του κύκλου ζωής τους, σύμφωνα με τα συμφωνημένα διεθνή πλαίσια, και σημαντική μείωση της απελευθέρωσής τους στον αέρα, το νερό και το έδαφος προκειμένου να ελαχιστοποιηθούν οι αρνητικές επιπτώσεις τους στην ανθρώπινη υγεία και το περιβάλλον."
            short_title: "Υπεύθυνη Διαχείριση Χημικών Ουσιών και Αποβλήτων"
          target_12_5:
            long_title: "Έως το 2030, ουσιαστική μείωση της δημιουργίας αποβλήτων μέσω της πρόληψης, της μείωσης, της ανακύκλωσης και της επαναχρησιμοποίησης."
            short_title: "Ουσιαστική Μείωση της Δημιουργίας Αποβλήτων"
          target_12_6:
            long_title: "Ενθάρρυνση των εταιρειών, ιδίως των μεγάλων και πολυεθνικών εταιρειών, να υιοθετήσουν βιώσιμες πρακτικές και να ενσωματώσουν πληροφορίες βιωσιμότητας στον κύκλο αναφορών τους."
            short_title: "Ενθάρρυνση των Εταιρειών για Υιοθέτηση Βιώσιμων Πρακτικών και Δημοσίευση Εκθέσεων Βιωσιμότητας"
          target_12_7:
            long_title: "Προώθηση πρακτικών δημόσιων συμβάσεων που είναι βιώσιμες, σύμφωνα με τις εθνικές πολιτικές και προτεραιότητες."
            short_title: "Προώθηση Βιώσιμων Πρακτικών Δημόσιων Συμβάσεων"
          target_12_8:
            long_title: "Έως το 2030, διασφάλιση ότι οι άνθρωποι παντού διαθέτουν τη σχετική ενημέρωση και ευαισθητοποίηση για τη βιώσιμη ανάπτυξη και τρόπους ζωής σε αρμονία με τη φύση."
            short_title: "Προώθηση της Καθολικής Κατανόησης των Βιώσιμων Τρόπων Ζωής"
          target_12_A:
            long_title: "Υποστήριξη των αναπτυσσόμενων χωρών για την ενίσχυση της επιστημονικής και τεχνολογικής τους ικανότητας ώστε να κινηθούν προς πιο βιώσιμα πρότυπα κατανάλωσης και παραγωγής."
            short_title: "Υποστήριξη της Επιστημονικής και Τεχνολογικής Ικανότητας των Αναπτυσσόμενων Χωρών για Βιώσιμη Κατανάλωση και Παραγωγή"
          target_12_B:
            long_title: "Ανάπτυξη και εφαρμογή εργαλείων για την παρακολούθηση των επιπτώσεων της βιώσιμης ανάπτυξης για τον βιώσιμο τουρισμό που δημιουργεί θέσεις εργασίας και προωθεί τον τοπικό πολιτισμό και τα προϊόντα."
            short_title: "Ανάπτυξη και Εφαρμογή Εργαλείων Παρακολούθησης του Βιώσιμου Τουρισμού"
          target_12_C:
            long_title: "Εξορθολογισμός των μη αποδοτικών επιδοτήσεων ορυκτών καυσίμων που ενθαρρύνουν τη σπάταλη κατανάλωση μέσω της εξάλειψης των στρεβλώσεων της αγοράς, σύμφωνα με τις εθνικές συνθήκες, μεταξύ άλλων μέσω της αναδιάρθρωσης της φορολογίας και της σταδιακής κατάργησης αυτών των επιβλαβών επιδοτήσεων, όπου υπάρχουν, ώστε να αντικατοπτρίζουν τις περιβαλλοντικές τους επιπτώσεις, λαμβάνοντας πλήρως υπόψη τις ειδικές ανάγκες και συνθήκες των αναπτυσσόμενων χωρών και ελαχιστοποιώντας τις πιθανές αρνητικές επιπτώσεις στην ανάπτυξή τους με τρόπο που προστατεύει τους φτωχούς και τις επηρεαζόμενες κοινότητες."
            short_title: "Εξάλειψη των Στρεβλώσεων της Αγοράς που Ενθαρρύνουν τη Σπάταλη Κατανάλωση"
      goal_13:
        title: "Δράση για το Κλίμα"
        title_in_two_lines: "Δράση για\nτο Κλίμα"
        description: "Λήψη άμεσων μέτρων για την καταπολέμηση της κλιματικής αλλαγής και των επιπτώσεών της."
        long_description: '<p>Το 2019 ήταν το <a href="https://news.un.org/en/story/2020/03/1059061">δεύτερο θερμότερο έτος που έχει καταγραφεί</a> και το τέλος της θερμότερης δεκαετίας (2010-2019) που έχει καταγραφεί ποτέ.&nbsp;&nbsp;</p> <p>Τα επίπεδα διοξειδίου του άνθρακα (CO2) και άλλων <a href="https://news.un.org/en/story/2020/04/1062332">αερίων του θερμοκηπίου στην ατμόσφαιρα</a> αυξήθηκαν σε νέα επίπεδα ρεκόρ το 2019.&nbsp;</p> <p>Η κλιματική αλλαγή επηρεάζει κάθε χώρα σε κάθε ἤπειρο. Διαταράσσει τις εθνικές οικονομίες και επηρεάζει τις ζωές των ανθρώπων. Τα καιρικά μοτίβα αλλάζουν, η στάθμη της θάλασσας ανεβαίνει και τα καιρικά φαινόμενα γίνονται πιο ακραία.</p> <p>Αν και οι εκπομπές αερίων του θερμοκηπίου προβλέπεται να μειωθούν κατά περίπου 6 τοις εκατό το 2020 λόγω των ταξιδιωτικών απαγορεύσεων και της οικονομικής επιβράδυνσης που προκλήθηκε από την πανδημία COVID-19, αυτή η βελτίωση είναι μόνο προσωρινή. <a href="https://news.un.org/en/story/2020/04/1062332">Η κλιματική αλλαγή δεν έχει μπει σε παύση</a>. Μόλις η παγκόσμια οικονομία αρχίσει να ανακάμπτει από την πανδημία, οι εκπομπές αναμένεται να επιστρέψουν σε υψηλότερα επίπεδα.</p> <p>Η διάσωση ζωών και μέσων διαβίωσης απαιτεί επείγουσα δράση για την αντιμετώπιση τόσο της πανδημίας όσο και της κλιματικής έκτακτης ανάγκης.</p> <p>Η <a href="https://unfccc.int/process-and-meetings/the-paris-agreement/the-paris-agreement">Συμφωνία του Παρισιού</a>, που υιοθετήθηκε το 2015, στοχεύει στην ενίσχυση της παγκόσμιας ανταπόκρισης στην απειλή της κλιματικής αλλαγής, διατηρώντας την αύξηση της παγκόσμιας θερμοκρασίας αυτόν τον αιώνα αρκετά κάτω από τους 2 βαθμούς Κελσίου πάνω από τα προβιομηχανικά επίπεδα. Η συμφωνία στοχεύει επίσης στην ενίσχυση της ικανότητας των χωρών να αντιμετωπίζουν τις επιπτώσεις της κλιματικής αλλαγής, μέσω κατάλληλων χρηματοπιστωτικών ροών, ενός νέου τεχνολογικού πλαισίου και ενός ενισχυμένου πλαισίου ανάπτυξης ικανοτήτων.</p>'
        targets:
          target_13_1:
            long_title: "Ενίσχυση της ανθεκτικότητας και της προσαρμοστικής ικανότητας απέναντι σε κινδύνους που σχετίζονται με το κλίμα και φυσικές καταστροφές σε όλες τις χώρες."
            short_title: "Ενίσχυση της Ανθεκτικότητας και της Προσαρμοστικής Ικανότητας απέναντι σε Καταστροφές που Σχετίζονται με το Κλίμα"
          target_13_2:
            long_title: "Ενσωμάτωση μέτρων για την κλιματική αλλαγή στις εθνικές πολιτικές, στρατηγικές και σχεδιασμούς."
            short_title: "Ενσωμάτωση Μέτρων για την Κλιματική Αλλαγή στις Πολιτικές και τον Σχεδιασμό"
          target_13_3:
            long_title: "Βελτίωση της εκπαίδευσης, της ευαισθητοποίησης και της ανθρώπινης και θεσμικής ικανότητας σχετικά με μετριασμό της κλιματικής αλλαγής, την προσαρμογή, τη μείωση των επιπτώσεων και την έγκαιρη προειδοποίηση."
            short_title: "Ανάπτυξη Γνώσης και Ικανότητας για την Αντιμετώπιση της Κλιματικής Αλλαγής"
          target_13_A:
            long_title: "Εφαρμογή της δέσμευσης που ανέλαβαν τα συμβαλλόμενα μέρη των αναπτυγμένων χωρών στη Σύμβαση-Πλαίσιο των Ηνωμένων Εθνών για την Κλιματική Αλλαγή για τον στόχο κοινής κινητοποίησης 100 δισεκατομμυρίων δολαρίων ετησίως έως το 2020 από όλες τις πηγές, για την αντιμετώπιση των αναγκών των αναπτυσσόμενων χωρών στο πλαίσιο ουσιαστικών δράσεων μετριασμού και διαφάνειας στην εφαρμογή, και πλήρης ενεργοποίηση του Πράσινου Ταμείου για το Κλίμα μέσω της κεφαλαιοποίησής του το συντομότερο δυνατό."
            short_title: "Εφαρμογή της Σύμβασης-Πλαισίου του ΟΗΕ για την Κλιματική Αλλαγή"
          target_13_B:
            long_title: "Προώθηση μηχανισμών για την αύξηση της ικανότητας αποτελεσματικού σχεδιασμού και διαχείρισης που σχετίζονται με την κλιματική αλλαγή στις λιγότερο αναπτυγμένες χώρες και τα μικρά νησιωτικά αναπτυσσόμενα Κράτη, συμπεριλαμβανομένης της εστίασης στις γυναίκες, τους νέους και τις τοπικές και περιθωριοποιημένες κοινότητες."
            short_title: "Προώθηση Μηχανισμών για την Αύξηση της Ικανότητας Σχεδιασμού και Διαχείρισης"
      goal_14:
        title: "Ζωή στο Νερό"
        title_in_two_lines: "Ζωή στο\nΝερό"
        description: "Διατήρηση και βιώσιμη χρήση των ωκεανών, των θαλασσών και των θαλάσσιων πόρων."
        long_description: '<p>Ο ωκεανός κατευθύνει τα παγκόσμια συστήματα που κάνουν τη Γη κατοικήσιμη για την ανθρωπότητα. Το νερό της βροχής, το πόσιμο νερό, ο καιρός, το κλίμα, οι ακτογραμμές, ένα μεγάλο μέρος των τροφίμων μας, ακόμη και το οξυγόνο στον αέρα που αναπνέουμε, παρέχονται και ρυθμίζονται τελικά από τη θάλασσα.&nbsp;</p> <p>Η προσεκτική διαχείριση αυτού του <a href="https://www.unenvironment.org/explore-topics/oceans-seas/why-do-oceans-and-seas-matter">απαραίτητου παγκόσμιου πόρου</a> αποτελεί βασικό χαρακτηριστικό ενός βιώσιμου μέλλοντος. Ωστόσο, αυτή τη στιγμή, υπάρχει συνεχής επιδείνωση των παράκτιων υδάτων λόγω ρύπανσης, και η οξίνιση των ωκεανών έχει αρνητικές επιπτώσεις στη λειτουργία των οικοσυστημάτων και τη βιοποικιλότητα. Αυτό επηρεάζει επίσης αρνητικά τη μικρής κλίμακας αλιεία.&nbsp;</p> <p>Η διάσωση του ωκεανού μας πρέπει να παραμείνει προτεραιότητα. Η θαλάσσια βιοποικιλότητα είναι κρίσιμη για την υγεία των ανθρώπων και του πλανήτη μας. Οι θαλάσσιες προστατευόμενες περιοχές πρέπει να αποτελούν αντικείμενο αποτελεσματικής διαχείρισης και κατάλληλης χρηματοδότησης, ενώ πρέπει να θεσπιστούν κανονισμοί για τη μείωση της υπεραλιείας, της θαλάσσιας ρύπανσης και της οξίνισης των ωκεανών.</p>'
        targets:
          target_14_1:
            long_title: "Έως το 2025, πρόληψη και σημαντική μείωση της θαλάσσιας ρύπανσης κάθε μορφής, ιδίως από χερσαίες δραστηριότητες, συμπεριλαμβανομένων των θαλάσσιων απορριμμάτων και της ρύπανσης από θρεπτικές ουσίες."
            short_title: "Μείωση της Θαλάσσιας Ρύπανσης"
          target_14_2:
            long_title: "Έως το 2020, βιώσιμη διαχείριση και προστασία των θαλάσσιων και παράκτιων οικοσυστημάτων για την αποφυγή σημαντικών αρνητικών επιπτώσεων, μεταξύ άλλων μέσω της ενίσχυσης της ανθεκτικότητάς τους, και λήψη δράσεων για την αποκατάστασή τους προκειμένου να επιτευχθούν υγιείς και παραγωγικοί ωκεανοί."
            short_title: "Προστασία και Αποκατάσταση Οικοσυστημάτων"
          target_14_3:
            long_title: "Ελαχιστοποίηση και αντιμετώπιση των επιπτώσεων της οξίνισης των ωκεανών, μεταξύ άλλων μέσω της ενισχυμένης επιστημονικής συνεργασίας σε όλα τα επίπεδα."
            short_title: "Μείωση της Οξίνισης των Ωκεανών"
          target_14_4:
            long_title: "Έως το 2020, αποτελεσματική ρύθμιση της συγκομιδής και τερματισμός της υπεραλιείας, της παράνομης, λαθραίας και ανεξέλεγκτης αλιείας και των καταστροφικών αλιευτικών πρακτικών, και εφαρμογή σχεδίων διαχείρισης βασισμένων στην επιστήμη, προκειμένου να αποκατασταθούν τα ιχθυαποθέματα στο συντομότερο δυνατό χρόνο, τουλάχιστον σε επίπεδα που μπορούν να παράγουν τη μέγιστη βιώσιμη απόδοση όπως καθορίζεται από τα βιολογικά τους χαρακτηριστικά."
            short_title: "Βιώσιμη Αλιεία"
          target_14_5:
            long_title: "Έως το 2020, διατήρηση τουλάχιστον του 10 τοις εκατό των παράκτιων και θαλάσσιων περιοχών, σύμφωνα με το εθνικό και διεθνές δίκαιο και με βάση τις καλύτερες διαθέσιμες επιστημονικές πληροφορίες."
            short_title: "Διατήρηση Παράκτιων και Θαλάσσιων Περιοχών"
          target_14_6:
            long_title: "Έως το 2020, απαγόρευση ορισμένων μορφών αλιευτικών επιδοτήσεων που συμβάλλουν στην υπερβολική αλιευτική ικανότητα και την υπεραλίευση, εξάλειψη των επιδοτήσεων που συμβάλλουν στην παράνομη, λαθραία και ανεξέλεγκτη αλιεία και αποχή από την εισαγωγή νέων τέτοιων επιδοτήσεων, αναγνωρίζοντας ότι η κατάλληλη και αποτελεσματική ειδική και διαφοροποιημένη μεταχείριση για τις αναπτυσσόμενες και τις λιγότερο αναπτυγμένες χώρες θα πρέπει να αποτελεί αναπόσπαστο μέρος των διαπραγματεύσεων του Παγκόσμιου Οργανισμού Εμπορίου για τις αλιευτικές επιδοτήσεις."
            short_title: "Τερματισμός των Επιδοτήσεων που Συμβάλλουν στην Υπεραλίευση"
          target_14_7:
            long_title: "Έως το 2030, αύξηση των οικονομικών οφελών για τα Μικρά Νησιωτικά Αναπτυσσόμενα Κράτη και τις λιγότερο αναπτυγμένες χώρες από τη βιώσιμη χρήση των θαλάσσιων πόρων, μεταξύ άλλων μέσω της βιώσιμης διαχείρισης της αλιείας, της υδατοκαλλιέργειας και του τουρισμού."
            short_title: "Αύξηση των Οικονομικών Οφελών από τη Βιώσιμη Χρήση των Θαλάσσιων Πόρων"
          target_14_A:
            long_title: "Αύξηση των επιστημονικών γνώσεων, ανάπτυξη της ερευνητικής ικανότητας και μεταφορά θαλάσσιας τεχνολογίας, λαμβάνοντας υπόψη τα Κριτήρια και τις Κατευθυντήριες Γραμμές της Διακυβερνητικής Ωκεανογραφικής Επιτροπής για τη Μεταφορά Θαλάσσιας Τεχνολογίας, προκειμένου να βελτιωθεί η υγεία των ωκεανών και να ενισχυθεί η συμβολή της θαλάσσιας βιοποικιλότητας στην ανάπτυξη των αναπτυσσόμενων χωρών, ιδίως των μικρών νησιωτικών αναπτυσσόμενων κρατών και των λιγότερο αναπτυγμένων χωρών."
            short_title: "Αύξηση των Επιστημονικών Γνώσεων, της Έρευνας και της Τεχνολογίας για την Υγεία των Ωκεανών"
          target_14_B:
            long_title: "Παροχή πρόσβασης στους παράκτιους αλιείς μικρής κλίμακας σε θαλάσσιους πόρους και αγορές."
            short_title: "Υποστήριξη των Αλιέων Μικρής Κλίμακας"
          target_14_C:
            long_title: "Ενίσχυση της διατήρησης και της βιώσιμης χρήσης των ωκεανών και των πόρων τους μέσω της εφαρμογής του διεθνούς δικαίου, όπως αντικατοπτρίζεται στη Σύμβαση των Ηνωμένων Εθνών για το Δίκαιο της Θάλασσας (UNCLOS), η οποία παρέχει το νομικό πλαίσιο για τη διατήρηση και τη βιώσιμη χρήση των ωκεανών και των πόρων τους, όπως υπενθυμίζεται στην παράγραφο 158 του «Το Μέλλον που Θέλουμε»."
            short_title: "Εφαρμογή και Επιβολή του Διεθνούς Δικαίου της Θάλασσας"
      goal_15:
        title: "Ζωή στη Στεριά"
        title_in_two_lines: "Ζωή στη\nΣτεριά"
        description: "Βιώσιμη διαχείριση των δασών, καταπολέμηση της ερημοποίησης, αναστολή και αντιστροφή της υποβάθμισης του εδάφους, αναστολή της απώλειας της βιοποικιλότητας."
        long_description: '<p>Η φύση είναι κρίσιμη για την επιβίωσή μας: η φύση μας παρέχει οξυγόνο, ρυθμίζει τα καιρικά μας μοτίβα, επικονιάζει τις καλλιέργειές μας, παράγει τα τρόφιμα, τις ζωοτροφές και τις ίνες μας. Αλλά δέχεται αυξανόμενη πίεση. <a href="https://news.un.org/en/story/2020/04/1061082">Η ανθρώπινη δραστηριότητα έχει αλλοιώσει σχεδόν το 75% της επιφάνειας της γης</a>, πιέζοντας την άγρια ζωή και τη φύση σε μια όλο και μικρότερη γωνιά του πλανήτη.</p> <p>Περίπου <a href="https://ipbes.net/sites/default/files/2020-02/ipbes_global_assessment_report_summary_for_policymakers_en.pdf">1 εκατομμύριο είδη ζώων και φυτών απειλούνται με εξαφάνιση</a> – πολλά μέσα σε δεκαετίες – σύμφωνα με την Έκθεση Παγκόσμιας Αξιολόγησης του 2019 για τη Βιοποικιλότητα και τις Υπηρεσίες Οικοσυστημάτων. Η έκθεση απηύθυνε έκκληση για μετασχηματιστικές αλλαγές για την αποκατάσταση και την προστασία της φύσης. Διαπίστωσε ότι η υγεία των οικοσυστημάτων από τα οποία εξαρτόμαστε εμείς και όλα τα άλλα είδη επιδεινώνεται ταχύτερα από ποτέ, επηρεάζοντας τα ίδια τα θεμέλια των οικονομιών μας, των μέσων διαβίωσης, της επισιτιστικής ασφάλειας, της υγείας και της ποιότητας ζωής μας παγκοσμίως.&nbsp;</p> <p>Η αποψίλωση των δασών και η ερημοποίηση – που προκαλούνται από τις ανθρώπινες δραστηριότητες και την κλιματική αλλαγή – συνιστούν μείζονες προκλήσεις για τη βιώσιμη ανάπτυξη και έχουν επηρεάσει τις ζωές και τα μέσα διαβίωσης εκατομμυρίων ανθρώπων. <a href="https://news.un.org/en/story/2019/05/1038291">Τα δάση είναι ζωτικής σημασίας </a>για τη διατήρηση της ζωής στη Γη και διαδραματίζουν μείζονα ρόλο στην καταπολέμηση της κλιματικής αλλαγής. Και η επένδυση στην <a href="https://news.un.org/en/story/2019/09/1045802">αποκατάσταση του εδάφους</a> είναι κρίσιμη για τη βελτίωση των μέσων διαβίωσης, τη μείωση των ευαλωτοτήτων και τη μείωση των κινδύνων για την οικονομία.</p> <p>Η υγεία του πλανήτη μας διαδραματίζει επίσης σημαντικό ρόλο στην <a href="https://www.unenvironment.org/resources/emerging-zoonotic-diseases-and-links-ecosystem-health-unep-frontiers-2016-chapter">εμφάνιση ζωονόσων</a>, δηλαδή ασθενειών που μεταδίδονται μεταξύ ζώων και ανθρώπων. Καθώς συνεχίζουμε να επεκτεινόμαστε σε εύθραυστα οικοσυστήματα, φέρνουμε τους ανθρώπους σε όλο και μεγαλύτερη επαφή με την άγρια ζωή, επιτρέποντας στα παθογόνα της άγριας ζωής να μεταφερθούν στα παραγωγικά ζώα και στους ανθρώπους, αυξάνοντας τον κίνδυνο εμφάνισης και εξάπλωσης ασθενειών.</p>'
        targets:
          target_15_1:
            long_title: "Έως το 2020, διασφάλιση της διατήρησης, αποκατάστασης και βιώσιμης χρήσης των χερσαίων και εσωτερικών οικοσυστημάτων γλυκού νερού και των υπηρεσιών τους, ιδίως των δασών, των υγροτόπων, των ορέων και των ξηρών εκτάσεων, σύμφωνα με τις υποχρεώσεις που απορρέουν από διεθνείς συμφωνίες."
            short_title: "Διατήρηση και Αποκατάσταση Χερσαίων Οικοσυστημάτων και Οικοσυστημάτων Γλυκού Νερού"
          target_15_2:
            long_title: "Έως το 2020, προώθηση της εφαρμογής της βιώσιμης διαχείρισης όλων των τύπων δασών, αναστολή της αποψίλωσης των δασών, αποκατάσταση των υποβαθμισμένων δασών και ουσιαστική αύξηση της δάσωσης και της αναδάσωσης παγκοσμίως."
            short_title: "Τερματισμός της Αποψίλωσης των Δασών και Αποκατάσταση των Υποβαθμισμένων Δασών"
          target_15_3:
            long_title: "Έως το 2030, καταπολέμηση της ερημοποίησης, αποκατάσταση της υποβαθμισμένης γης και του εδάφους, συμπεριλαμβανομένων των εκτάσεων που επηρεάζονται από την ερημοποίηση, τη ξηρασία και τις πλημμύρες, και προσπάθεια για την επίτευξη ενός κόσμου με ουδέτερη υποβάθμιση του εδάφους."
            short_title: "Τερματισμός της Ερημοποίησης και Αποκατάσταση της Υποβαθμισμένης Γης"
          target_15_4:
            long_title: "Έως το 2030, διασφάλιση της διατήρησης των ορεινών οικοσυστημάτων, συμπεριλαμβανομένης της βιοποικιλότητάς τους, προκειμένου να ενισχυθεί η ικανότητά τους να παρέχουν οφέλη που είναι απαραίτητα για τη βιώσιμη ανάπτυξη."
            short_title: "Διασφάλιση της Διατήρησης των Ορεινών Οικοσυστημάτων"
          target_15_5:
            long_title: "Λήψη επείγουσας και σημαντικής δράσης για τη μείωση της υποβάθμισης των φυσικών οικοτόπων, την αναστολή της απώλειας της βιοποικιλότητας και, έως το 2020, την προστασία και την πρόληψη της εξαφάνισης των απειλούμενων ειδών."
            short_title: "Προστασία της Βιοποικιλότητας και των Φυσικών Οικοτόπων"
          target_15_6:
            long_title: "Προώθηση της δίκαιης και ισότιμης κατανομής των οφελών που προκύπτουν από τη χρησιμοποίηση των γενετικών πόρων και προώθηση της κατάλληλης πρόσβασης σε αυτούς τους πόρους, όπως έχει συμφωνηθεί διεθνώς."
            short_title: "Προώθηση της Πρόσβασης στους Γενετικούς Πόρους και της Δίκαιης Κατανομής των Οφελών"
          target_15_7:
            long_title: "Λήψη επείγουσας δράσης για τον τερματισμό της λαθροθηρίας και της παράνομης διακίνησης προστατευόμενων ειδών χλωρίδας και πανίδας και αντιμετώπιση τόσο της ζήτησης όσο και της προσφοράς παράνομων προϊόντων άγριας ζωής."
            short_title: "Εξάλειψη της Λαθροθηρίας και της Παράνομης Διακίνησης Προστατευόμενων Ειδών"
          target_15_8:
            long_title: "Έως το 2020, εισαγωγή μέτρων για την πρόληψη της εισαγωγής και τη σημαντική μείωση των επιπτώσεων των εισβλητικών ξένων ειδών στα χερσαία και υδάτινα οικοσυστήματα και έλεγχος ή εξάλειψη των ειδών προτεραιότητας."
            short_title: "Πρόληψη των Εισβλητικών Ξένων Ειδών στα Χερσαία και Υδάτινα Οικοσυστήματα"
          target_15_9:
            long_title: "Έως το 2020, ενσωμάτωση των αξιών των οικοσυστημάτων και της βιοποικιλότητας στον εθνικό και τοπικό σχεδιασμό, τις αναπτυξιακές διαδικασίες, τις στρατηγικές μείωσης της φτώχειας και τους λογαριασμούς."
            short_title: "Ενσωμάτωση του Οικοσυστήματος και της Βιοποικιλότητας στον Κυβερνητικό Σχεδιασμό"
          target_15_A:
            long_title: "Κινητοποίηση και σημαντική αύξηση των χρηματοδοτικών πόρων από όλες τις πηγές για τη διατήρηση και τη βιώσιμη χρήση της βιοποικιλότητας και των οικοσυστημάτων."
            short_title: "Αύξηση των Χρηματοδοτικών Πόρων για τη Διατήρηση και τη Βιώσιμη Χρήση των Οικοσυστημάτων και της Βιοποικιλότητας"
          target_15_B:
            long_title: "Κινητοποίηση σημαντικών πόρων από όλες τις πηγές και σε όλα τα επίπεδα για τη χρηματοδότηση της βιώσιμης διαχείρισης των δασών και παροχή επαρκών κινήτρων στις αναπτυσσόμενες χώρες για την προώθηση αυτής της διαχείρισης, συμπεριλαμβανομένης της διατήρησης και της αναδάσωσης."
            short_title: "Χρηματοδότηση και Παροχή Κινήτρων για τη Βιώσιμη Διαχείριση των Δασών"
          target_15_C:
            long_title: "Ενίσχυση της παγκόσμιας υποστήριξης για τις προσπάθειες καταπολέμησης της λαθροθηρίας και της παράνομης διακίνησης προστατευόμενων ειδών, μεταξύ άλλων μέσω της αύξησης της ικανότητας των τοπικών κοινοτήτων να επιδιώκουν ευκαιρίες βιώσιμου βιοπορισμού."
            short_title: "Καταπολέμηση της Παγκόσμιας Λαθροθηρίας και Παράνομης Διακίνησης"
      goal_16:
        title: "Ειρήνη, Δικαιοσύνη και Ισχυροί Θεσμοί"
        title_in_two_lines: "Ειρήνη, Δικαιοσύνη και\nΙσχυροί Θεσμοί"
        description: "Προώθηση δίκαιων, ειρηνικών και συμπεριληπτικών κοινωνιών."
        long_description: '<p>Οι συγκρούσεις, η ανασφάλεια, οι αδύναμοι θεσμοί και η περιορισμένη πρόσβαση στη δικαιοσύνη παραμένουν μεγάλη απειλή για τη βιώσιμη ανάπτυξη.&nbsp;</p> <p>Ο αριθμός των <a href="https://www.unhcr.org/en-us/news/press/2019/6/5d03b22b4/worldwide-displacement-tops-70-million-un-refugee-chief-urges-greater-solidarity.html">ανθρώπων που εγκαταλείπουν τον πόλεμο, τις διώξεις και τις συγκρούσεις ξεπέρασε τα 70 εκατομμύρια</a> το 2018, το υψηλότερο επίπεδο που έχει καταγραφεί από την Ύπατη Αρμοστεία του ΟΗΕ για τους Πρόσφυγες (UNHCR) σε σχεδόν 70 χρόνια.&nbsp;</p> <p>Το 2019, τα Ηνωμένα Έθνη κατέγραψαν <a href="https://sustainabledevelopment.un.org/content/documents/26158Final_SG_SDG_Progress_Report_14052020.pdf">357 δολοφονίες και 30 καταναγκαστικές εξαφανίσεις</a> υπερασπιστών των ανθρωπίνων δικαιωμάτων, δημοσιογράφων και συνδικαλιστών σε 47 χώρες.</p> <p>Και οι γεννήσεις περίπου <a href="https://data.unicef.org/topic/child-protection/birth-registration/">ενός στα τέσσερα παιδιά</a> κάτω των 5 ετών παγκοσμίως δεν καταγράφονται ποτέ επίσημα, στερώντας τους την απόδειξη της νομικής ταυτότητας που είναι κρίσιμη για την προστασία των δικαιωμάτων τους και για την πρόσβαση στη δικαιοσύνη και τις κοινωνικές υπηρεσίες.</p>'
        targets:
          target_16_1:
            long_title: "Σημαντική μείωση όλων των μορφών βίας και των σχετικών ποσοστών θνησιμότητας παντού."
            short_title: "Μείωση της Βίας Παντού"
          target_16_2:
            long_title: "Τερματισμός της κακοποίησης, της εκμετάλλευσης, της εμπορίας και όλων των μορφών βίας και βασανιστηρίων κατά των παιδιών."
            short_title: "Προστασία των Παιδιών από την Κακοποίηση, την Εκμετάλλευση, την Εμπορία και τη Βία"
          target_16_3:
            long_title: "Προώθηση του κράτους δικαίου σε εθνικό και διεθνές επίπεδο και διασφάλιση της ίσης πρόσβασης στη δικαιοσύνη για όλους."
            short_title: "Προώθηση του Κράτους Δικαίου και Διασφάλιση Ίσης Πρόσβασης στη Δικαιοσύνη"
          target_16_4:
            long_title: "Έως το 2030, σημαντική μείωση των παράνομων χρηματοπιστωτικών ροών και ροών όπλων, ενίσχυση της ανάκτησης και επιστροφής των κλεμμένων περιουσιακών στοιχείων και καταπολέμηση όλων των μορφών οργανωμένου εγκλήματος."
            short_title: "Καταπολέμηση του Οργανωμένου Εγκλήματος και των Παράνομων Χρηματοπιστωτικών Ροών και Ροών Όπλων"
          target_16_5:
            long_title: "Ουσιαστική μείωση της διαφθοράς και της δωροδοκίας σε όλες τις μορφές τους."
            short_title: "Ουσιαστική Μείωση της Διαφθοράς και της Δωροδοκίας"
          target_16_6:
            long_title: "Ανάπτυξη αποτελεσματικών, υπόλογων και διαφανών θεσμών σε όλα τα επίπεδα."
            short_title: "Ανάπτυξη Αποτελεσματικών, Υπόλογων και Διαφανών Θεσμών"
          target_16_7:
            long_title: "Διασφάλιση της ανταποκρινόμενης, συμπεριληπτικής, συμμετοχικής και αντιπροσωπευτικής λήψης αποφάσεων σε όλα τα επίπεδα."
            short_title: "Διασφάλιση Ανταποκρινόμενης, Συμπεριληπτικής και Αντιπροσωπευτικής Λήψης Αποφάσεων"
          target_16_8:
            long_title: "Διεύρυνση και ενίσχυση της συμμετοχής των αναπτυσσόμενων χωρών στους θεσμούς της παγκόσμιας διακυβέρνησης."
            short_title: "Ενίσχυση της Συμμετοχής στην Παγκόσμια Διακυβέρνηση"
          target_16_9:
            long_title: "Έως το 2030, παροχή νομικής ταυτότητας για όλους, συμπεριλαμβανομένης της καταγραφής των γεννήσεων."
            short_title: "Παροχή Καθολικής Νομικής Ταυτότητας"
          target_16_10:
            long_title: "Διασφάλιση της δημόσιας πρόσβασης σε πληροφορίες και προστασία των θεμελιωδών ελευθεριών, σύμφωνα με την εθνική νομοθεσία και τις διεθνείς συμφωνίες."
            short_title: "Διασφάλιση Δημόσιας Πρόσβασης σε Πληροφορίες και Προστασία Θεμελιωδών Ελευθεριών"
          target_16_A:
            long_title: "Ενίσχυση των σχετικών εθνικών θεσμών, μεταξύ άλλων μέσω της διεθνούς συνεργασίας, για την ανάπτυξη ικανοτήτων σε όλα τα επίπεδα, ιδίως στις αναπτυσσόμενες χώρες, για την πρόληψη της βίας και την καταπολέμηση της τρομοκρατίας και του εγκλήματος."
            short_title: "Ενίσχυση των Εθνικών Θεσμών για την Πρόληψη της Βίας και την Καταπολέμηση της Τρομοκρατίας και του Εγκλήματος"
          target_16_B:
            long_title: "Προώθηση και επιβολή νόμων και πολιτικών χωρίς διακρίσεις για τη βιώσιμη ανάπτυξη."
            short_title: "Προώθηση και Επιβολή Νόμων και Πολιτικών χωρίς Διακρίσεις"
      goal_17:
        title: "Συνεργασία για τους Στόχους"
        title_in_two_lines: "Συνεργασία\nγια τους Στόχους"
        description: "Αναζωογόνηση της παγκόσμιας εταιρικής σχέσης για τη Βιώσιμη Ανάπτυξη."
        long_description: '<p>Οι ΣΒΑ μπορούν να υλοποιηθούν μόνο με ισχυρές παγκόσμιες εταιρικές σχέσεις και συνεργασία.</p> <p>Mια επιτυχημένη αναπτυξιακή ατζέντα απαιτεί συμπεριληπτικές εταιρικές σχέσεις — σε παγκόσμιο, περιφερειακό, εθνικό και τοπικό επίπεδο — που βασίζονται σε αρχές και αξίες, καθώς και σε ένα κοινό όραμα και κοινούς στόχους που θέτουν τους ανθρώπους και τον πλανήτη στο επίκεντρο.</p> <p>Πολλές χώρες απαιτούν Επίσημη Αναπτυξιακή Βοήθεια για την ενθάρρυνση της ανάπτυξης και του εμπορίου. Ωστόσο, <a href="https://www.un.org/press/en/2019/ga12191.doc.htm">τα επίπεδα βοήθειας μειώνονται</a> και οι χώρες-δωρητές δεν έχουν ανταποκριθεί στη δέσμευσή τους να αυξήσουν την αναπτυξιακή χρηματοδότηση.</p> <p>Λόγω της πανδημίας COVID-19, η <a href="https://www.imf.org/en/Publications/WEO/Issues/2020/04/14/weo-april-2020">παγκόσμια οικονομία</a> προβλέπεται να συρρικνωθεί απότομα, κατά 3%, το 2020, βιώνοντας τη χειρότερη ύφεση από τη Μεγάλη Ύφεση.</p> <p>Η ισχυρή διεθνής συνεργασία είναι απαραίτητη τώρα περισσότερο από ποτέ για να διασφαλιστεί ότι οι χώρες διαθέτουν τα μέσα να ανακάμψουν από την πανδημία, να ανασυγκροτηθούν καλύτερα και να επιτύχουν τους Στόχους Βιώσιμης Ανάπτυξης.</p>'
        targets:
          target_17_1:
            long_title: "Ενίσχυση της κινητοποίησης των εγχώριων πόρων, μεταξύ άλλων μέσω της διεθνούς υποστήριξης προς τις αναπτυσσόμενες χώρες, για τη βελτίωση της εγχώριας ικανότητας είσπραξης φόρων και άλλων εσόδων."
            short_title: "Κινητοποίηση Πόρων για τη Βελτίωση της Εγχώριας Είσπραξης Εσόδων"
          target_17_2:
            long_title: "Πλήρης εφαρμογή των δεσμεύσεων επίσημης αναπτυξιακής βοήθειας από τις αναπτυγμένες χώρες, συμπεριλαμβανομένης της δέσμευσης πολλών αναπτυγμένων χωρών να επιτύχουν τον στόχο του 0,7% της ΕΑΒ/ΑΕΕ προς τις αναπτυσσόμενες χώρες και 0,15 έως 0,20% της ΕΑΒ/ΑΕΕ προς τις λιγότερο αναπτυγμένες χώρες. Οι πάροχοι ΕΑΒ ενθαρρύνονται να εξετάσουν το ενδεχόμενο καθορισμού στόχου για την παροχή τουλάχιστον 0,20% της ΕΑΒ/ΑΕΕ στις λιγότερο αναπτυγμένες χώρες."
            short_title: "Εφαρμογή όλων των Δεσμεύσεων Αναπτυξιακής Βοήθειας"
          target_17_3:
            long_title: "Κινητοποίηση πρόσθετων χρηματοδοτικών πόρων για τις αναπτυσσόμενες χώρες από πολλαπλές πηγές."
            short_title: "Κινητοποίηση Χρηματοδοτικών Πόρων για τις Αναπτυσσόμενες Χώρες"
          target_17_4:
            long_title: "Παροχή βοήθειας στις αναπτυσσόμενες χώρες για την επίτευξη μακροπρόθεσμης βιωσιμότητας του χρέους μέσω συντονισμένων πολιτικών που αποσκοπούν στην προώθηση της χρηματοδότησης του χρέους, της ελάφρυνσης του χρέους και της αναδιάρθρωσης του χρέους, κατά περίπτωση, και αντιμετώπιση του εξωτερικού χρέους των υπερχρεωμένων φτωχών χωρών για τη μείωση της δυσφορίας του χρέους."
            short_title: "Υποστήριξη των Αναπτυσσόμενων Χωρών στην Επίτευξη Βιωσιμότητας του Χρέους"
          target_17_5:
            long_title: "Υιοθέτηση και εφαρμογή καθεστώτων προώθησης επενδύσεων για τις λιγότερο αναπτυγμένες χώρες."
            short_title: "Επενδύσεις στις Λιγότερο Αναπτυγμένες Χώρες"
          target_17_6:
            long_title: "Ενίσχυση της περιφερειακής και διεθνούς συνεργασίας Βορρά-Νότου, Νότου-Νότου και τριγωνικής συνεργασίας όσον αφορά την πρόσβαση στην επιστήμη, την τεχνολογία και την καινοτομία, και ενίσχυση της ανταλλαγής γνώσεων σε αμοιβαία συμφωνημένους όρους, μεταξύ άλλων μέσω βελτιωμένου συντονισμού μεταξύ των υφιστάμενων μηχανισμών, ιδίως σε επίπεδο Ηνωμένων Εθνών, και μέσω ενός παγκόσμιου μηχανισμού διευκόλυνσης της τεχνολογίας."
            short_title: "Ανταλλαγή Γνώσεων και Συνεργασία για Πρόσβαση στην Επιστήμη, την Τεχνολογία και την Καινοτομία"
          target_17_7:
            long_title: "Προώθηση της ανάπτυξης, μεταφοράς, διάδοσης και εξάπλωσης περιβαλλοντικά ορθών τεχνολογιών στις αναπτυσσόμενες χώρες με ευνοϊκούς όρους, συμπεριλαμβανομένων ευνοϊκών και προτιμησιακών όρων, όπως έχει αμοιβαία συμφωνηθεί."
            short_title: "Προώθηση Βιώσιμων Τεχνολογιών στις Αναπτυσσόμενες Χώρες"
          target_17_8:
            long_title: "Πλήρης ενεργοποίηση της τράπεζας τεχνολογίας και του μηχανισμού ανάπτυξης ικανοτήτων για την επιστήμη, την τεχνολογία και την καινοτομία για τις λιγότερο αναπτυγμένες χώρες έως το 2017 και ενίσχυση της χρήσης τεχνολογιών διευκόλυνσης, ιδίως της τεχνολογίας πληροφοριών και επικοινωνιών."
            short_title: "Ενίσχυση της Ικανότητας Επιστήμης, Τεχνολογίας και Καινοτομίας για τις Λιγότερο Αναπτυγμένες Χώρες"
          target_17_9:
            long_title: "Ενίσχυση της διεθνούς υποστήριξης για την εφαρμογή αποτελεσματικής και στοχευμένης ανάπτυξης ικανοτήτων στις αναπτυσσόμενες χώρες, για την υποστήριξη εθνικών σχεδίων εφαρμογής όλων των στόχων βιώσιμης ανάπτυξης, μεταξύ άλλων μέσω της συνεργασίας Βορρά-Νότου, Νότου-Νότου και τριγωνικής συνεργασίας."
            short_title: "Ενίσχυση της Ικανότητας για τους ΣΒΑ στις Αναπτυσσόμενες Χώρες"
          target_17_10:
            long_title: "Προώθηση ενός καθολικού, βασισμένου σε κανόνες, ανοικτού, μη εισάγοντος διακρίσεις και δίκαιου πολυμερούς εμπορικού συστήματος υπό τον Παγκόσμιο Οργανισμό Εμπορίου, μεταξύ άλλων μέσω της ολοκλήρωσης των διαπραγματεύσεων στο πλαίσιο της Αναπτυξιακής Ατζέντας της Ντόχα."
            short_title: "Προώθηση Καθολικού Εμπορικού Συστήματος υπό τον ΠΟΕ"
          target_17_11:
            long_title: "Σημαντική αύξηση των εξαγωγών των αναπτυσσόμενων χωρών, ιδίως με σκοπό τον διπλασιασμό του μεριδίου των λιγότερο αναπτυγμένων χωρών στις παγκόσμιες εξαγωγές έως το 2020."
            short_title: "Αύξηση των Εξαγωγών των Αναπτυσσόμενων Χωρών"
          target_17_12:
            long_title: "Επίτευξη έγκαιρης εφαρμογής της ατελούς και αφορολόγητης πρόσβασης στην αγορά σε διαρκή βάση για όλες τις λιγότερο αναπτυγμένες χώρες, σύμφωνα με τις αποφάσεις του Παγκόσμιου Οργανισμού Εμπορίου, μεταξύ άλλων μέσω της διασφάλισης ότι οι προτιμησιακοί κανόνες καταγωγής που εφαρμόζονται στις εισαγωγές από τις λιγότερο αναπτυγμένες χώρες είναι διαφανείς και απλοί, και συμβάλλουν στη διευκόλυνση της πρόσβασης στην αγορά."
            short_title: "Άρση των Εμπορικών Εμποδίων για τις Λιγότερο Αναπτυγμένες Χώρες"
          target_17_13:
            long_title: "Ενίσχυση της παγκόσμιας μακροοικονομικής σταθερότητας, μεταξύ άλλων μέσω του συντονισμού και της συνοχής των πολιτικών."
            short_title: "Ενίσχυση της Παγκόσμιας Μακροοικονομικής Σταθερότητας"
          target_17_14:
            long_title: "Ενίσχυση της συνοχής των πολιτικών για τη βιώσιμη ανάπτυξη."
            short_title: "Ενίσχυση της Συνοχής των Πολιτικών για τη Βιώσιμη Ανάπτυξη"
          target_17_15:
            long_title: "Σεβασμός του πολιτικού χώρου και της ηγεσίας κάθε χώρας για τη θέσπιση και την εφαρμογή πολιτικών για την εξάλειψη της φτώχειας και τη βιώσιμη ανάπτυξη."
            short_title: "Σεβασμός της Εθνικής Ηγεσίας για την Εφαρμογή Πολιτικών για τους Στόχους Βιώσιμης Ανάπτυξης"
          target_17_16:
            long_title: "Ενίσχυση της παγκόσμιας εταιρικής σχέσης για τη βιώσιμη ανάπτυξη, συμπληρούμενη από πολυμερείς εταιρικές σχέσεις που κινητοποιούν και μοιράζονται γνώσεις, τεχνογνωσία, τεχνολογία και χρηματοδοτικούς πόρους, για την υποστήριξη της επίτευξης των στόχων βιώσιμης ανάπτυξης σε όλες τις χώρες, ιδίως τις αναπτυσσόμενες χώρες."
            short_title: "Ενίσχυση της Παγκόσμιας Εταιρικής Σχέσης για τη Βιώσιμη Ανάπτυξη"
          target_17_17:
            long_title: "Ενθάρρυνση και προώθηση αποτελεσματικών δημόσιων, δημοσίου-ιδιωτικού τομέα και κοινωνίας των πολιτών εταιρικών σχέσεων, αξιοποιώντας την εμπειρία και τις στρατηγικές πόρων των εταιρικών σχέσεων."
            short_title: "Ενθάρρυνση Αποτελεσματικών Εταιρικών Σχέσεων"
          target_17_18:
            long_title: "Έως το 2020, ενίσχυση της υποστήριξης για την ανάπτυξη ικανοτήτων στις αναπτυσσόμενες χώρες, συμπεριλαμβανομένων των λιγότερο αναπτυγμένων χωρών και των μικρών νησιωτικών αναπτυσσόμενων κρατών, για τη σημαντική αύξηση της διαθεσιμότητας υψηλής ποιότητας, έγκαιρων και αξιόπιστων δεδομένων, ανάλυσης ανά εισόδημα, φύλο, ηλικία, φυλή, εθνότητα, μεταναστευτικό καθεστώς, αναπηρία, γεωγραφική موقع και άλλα χαρακτηριστικά σχετικά σε εθνικό επίπεδο."
            short_title: "Ενίσχυση Διαθεσιμότητας Αξιόπιστων Δεδομένων"
          target_17_19:
            long_title: "Έως το 2030, αξιοποίηση των υφιστάμενων πρωτοβουλιών για την ανάπτυξη μετρήσεων της προόδου όσον αφορά τη βιώσιμη ανάπτυξη που συμπληρώνουν το ακαθάριστο εγχώριο προϊόν, και υποστήριξη της ανάπτυξης στατιστικών ικανοτήτων στις αναπτυσσόμενες χώρες."
            short_title: "Περαιτέρω Ανάπτυξη Μετρήσεων Προόδου"
      help:
        title: "Βοήθεια για τους Στόχους Βιώσιμης Ανάπτυξης"
