      text: "A tartalom sikeresen elkészült."
      title: "Gépi tanulási szkript"
    new_actions_notification_on_create:
      subject: "Az állampolgári javaslatod piszkozatként létrejött"
      hi: "Szia %{name}!"
      introduction: "A(z) %{title} javaslatod sikeresen létrejött."
      text_1: "Használd ki, hogy a javaslatod még nem nyilvános, és készülj fel arra, hogy sok embert megszólíts."
      text_2: "Ha készen állsz, ezen a <a href='%{link}'>linken</a> teheted közzé az állampolgári javaslatodat."
      text_3: "Tudjuk, hogy egy figyelemfelkeltő javaslat elkészítése és a szükséges támogatás megszerzése bonyolultnak tűnhet. De ne aggódj, segítünk!"
      text_4: "Van egy eszközöd, ami az új legjobb szövetségesed lesz: az Állampolgári javaslatok panel."
      list_1: "Lépj be minden nap a javaslatod paneljére, és használd azokat a tippeket és erőforrásokat, amelyeket megosztunk veled."
      list_2: "Ezek a tippek, lépések és erőforrások ötleteket és gyakorlati megoldásokat adnak, hogy több támogatást és nagyobb közösséget szerezz."
      list_3: "Ahogy egyre több támogatást szerzel, új és jobb erőforrások nyílnak meg előtted. Jelenleg van egy e-mail-sablonod, amellyel tömegesen írhatsz a kapcsolataidnak, egy kinyomtatható posztered, és még sok más funkció és jutalom, amelyeket később fedezhetsz fel. Ne hagyd abba a támogatások gyűjtését, és mi sem hagyjuk abba a jutalmazásodat és támogatásodat!"
      list_4: "A javaslat közzététele után %{max_month} hónapod van arra, hogy megszerezd a(z) %{max_votes} támogatást, és a javaslatodból valóság lehessen. De az első napok a legfontosabbak. Ez kihívás. Készülj fel!"
      text_5: "És hogy teljes lelkesedéssel indulj,"
      text_6: "itt találsz néhány erőforrást és egy egész listányi tippet, amelyek minden nap segítenek a terjesztés előkészítésében!"
      dashboard_button: "Gyerünk, fedezd fel őket!"
    new_actions_notification_on_published:
      subject: "Az állampolgári javaslatod már nyilvános. Terjeszd tovább!"
      hi: "Gratulálunk %{name}! A(z) %{title} javaslatod sikeresen közzé lett téve."
      text_1: "Most pedig irány az első 100 támogatás!"
      text_2: "Miért pont 100?"
      text_3: "A tapasztalataink azt mutatják, hogy az első nap kulcsfontosságú. Egyrészt még megvan benned az új kezdeményezés lendülete, másrészt újonnan közzétett javaslatként kiemelt láthatóságot kapsz az új javaslatok között."
      text_4: "Szerezz 100 támogatást az első napon, és máris lesz egy első közösség, amely melléd áll."
      text_5: "Ezért kihívás elé állítunk, de nem segítség nélkül!"
      text_6: "Ne feledd, a Javaslat panelen új erőforrások és ajánlott terjesztési lépések várnak rád."
      list_1: "Nézz be minden nap, hogy lásd az előrehaladásodat, és használd a tippeket és erőforrásokat, amelyeket megosztunk veled. Ezek nemcsak ötletek, hanem gyakorlati megoldások is a szükséges támogatás megszerzéséhez."
      list_2: "Ahogy egyre több támogatást szerzel, újabb és jobb erőforrások nyílnak meg előtted. Ne hagyd abba a támogatások gyűjtését, és mi sem hagyjuk abba a jutalmazásodat és támogatásodat!"
      text_7: "És hogy teljes sebességgel kezdhess..."
      text_8: "Itt egy nagyszerű erőforrás, ami már most a rendelkezésedre áll!"
      text_9: "Ezt az új ajánlott terjesztési lépést is megtalálod..."
      text_10: "Biztosan van még több erőforrásod, amit használhatsz!"
      dashboard_button: "Gyerünk, fedezd fel őket!"
