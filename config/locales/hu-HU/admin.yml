        info: |-
          <p>Itt tudod adminisztrátorként megvalósítani és felügyelni a városod vagy régiód polgári részvételi folyamatait.</p>

          <p>Most már a világ több száz kormánya és önkormányzata közé tartozol, amelyek a CONSUL DEMOCRACY platformot használják a polgári részvétel gyakorlati megvalósítására.</p>

          <p>A CONSUL DEMOCRACY Foundation a globális felhasználói közösség középpontjában áll. Kérjük, vedd fel velünk a kapcsolatot, hogy jobban lássuk, kik használják a szoftvert, és hogyan tudunk segíteni a bevezetésben vagy a használatban. Várjuk, hogy üdvözölhessünk a közösségben.</p>

          <p>Sikeres adminisztrációt kívánunk!</p>

          <p>Üdvözlettel: a CONSUL DEMOCRACY Foundation csapata.</p>
