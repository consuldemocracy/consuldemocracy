---
EnableDefaultLinters: false
exclude:
  - '**/vendor/**/*'
  - 'lib/capistrano/templates/*'
linters:
  HardCodedString:
    enabled: true
    exclude:
      - app/views/mailer/proposal_notification_digest.html.erb
      - app/views/**/*.js.erb
      - app/views/**/*.json.erb
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Rails/HttpStatus:
        Enabled: true
        Exclude:
          - app/views/dashboard/*
      Rails/OutputSafety:
        Enabled: false
