version: 0.11.0

# Framework and template engine configuration
#
# Options: ruby | actionview | hanami | sinatra (default: ruby)
framework: actionview

# Options: erubi | erb | herb (default: erubi)
template_engine: herb

engine:
  validators:
    security: true
    nesting: true
    accessibility: true

linter:
  enabled: true
  # Exit with error code when diagnostics of this severity or higher are present
  # Valid values: error (default), warning, info, hint
  failLevel: hint

  # Only report diagnostics of this severity or higher
  # Affects the CLI output only: lower-severity offenses are still counted in the
  # summary and still show up in your editor, they just aren't printed or
  # annotated in CI. Valid values: error, warning, info, hint (default)
  # logLevel: warning

  rules:
    # The 'all' pseudo rule sets the default for every rule you don't list.
    #   false: start from an empty set and opt back in explicitly
    #   true:  start from every rule, including the ones off by default
    all:
      enabled: false
    a11y-disabled-attribute:
      enabled: true
    a11y-nested-interactive-elements:
      enabled: true
    a11y-no-aria-label-misuse:
      enabled: true
    a11y-no-aria-unsupported-elements:
      enabled: true
    a11y-svg-has-accessible-text:
      enabled: true
    actionview-no-content-argument-with-block:
      enabled: true
    actionview-no-implicit-partial:
      enabled: true
      exclude:
        - "app/components/admin/allowed_table_actions_component.html.erb"
        - "app/components/admin/budgets/table_actions_component.html.erb"
    actionview-no-implicit-polymorphic-url:
      enabled: true
      exclude:
        - "app/components/documents/document_component.html.erb"
        - "app/components/polls/gallery_component.html.erb"
        - "app/views/admin/milestones/_milestones.html.erb"
    actionview-no-render-option-shadowing:
      enabled: true
    actionview-no-silent-helper:
      enabled: true
    actionview-no-silent-render:
      enabled: true
    actionview-no-void-element-content:
      enabled: true
    actionview-prefer-link-to-helper:
      enabled: true
    erb-no-duplicate-branch-elements:
      enabled: true
      exclude:
        - "app/components/polls/results/question_component.html.erb"
    erb-no-unused-block-argument:
      enabled: true
    erb-no-unused-local-variable:
      enabled: true
    erb-prefer-each-over-map:
      enabled: true
    html-attribute-values-require-quotes:
      enabled: true
    html-boolean-attributes-no-value:
      enabled: true
    html-img-require-alt:
      enabled: true
    html-no-empty-attributes:
      enabled: true
    html-no-self-closing:
      enabled: true
    html-no-style-elements:
      enabled: true
      exclude:
        - "public/**/*"

formatter:
  enabled: true
  indentWidth: 2
  indentStyle: space
  maxLineLength: 110
